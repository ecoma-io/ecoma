<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Ecoma Hub">
  <!-- Ecoma Hub — PLACEHOLDER mark. One rounded square split by a seam: steel is
       the human half, ember the agent half (the dual-force law). The product
       glyph is knocked out through a mask, so the mark sits on any background
       without a white plate behind it. Geometry is deliberately plain; this is
       scaffold brand, not the final identity. -->
  <defs>
    <linearGradient id="shb" x1="8" y1="88" x2="48" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A63D9"/><stop offset="1" stop-color="#79ADFF"/>
    </linearGradient>
    <linearGradient id="ehb" x1="88" y1="88" x2="48" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EF5F26"/><stop offset="1" stop-color="#FFA659"/>
    </linearGradient>
    <mask id="mhb">
      <rect width="96" height="96" fill="#fff"/>
      <rect x="46.6" y="0" width="2.8" height="96" fill="#000"/>
      <circle cx="48" cy="48" r="8" fill="#000"/>
      <circle cx="48" cy="24" r="5.5" fill="#000"/>
      <circle cx="27" cy="62" r="5.5" fill="#000"/>
      <circle cx="69" cy="62" r="5.5" fill="#000"/>
      <path d="M48 32 V40 M41.5 52.5 L33 58 M54.5 52.5 L63 58" stroke="#000" stroke-width="4" stroke-linecap="round" fill="none"/>
    </mask>
  </defs>
  <g mask="url(#mhb)">
    <path d="M21 0 H48 V96 H21 A21 21 0 0 1 0 75 V21 A21 21 0 0 1 21 0 Z" fill="url(#shb)"/>
    <path d="M48 0 H75 A21 21 0 0 1 96 21 V75 A21 21 0 0 1 75 96 H48 Z" fill="url(#ehb)"/>
  </g>
</svg>
