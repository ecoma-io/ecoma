# Git hooks — see CONTRIBUTING.md
# Everything runs through Nx (the only task runner in this repo).

pre-commit:
  parallel: false
  commands:
    commit-identity:
      # Refuse a commit still carrying the cloud-sandbox agent-bot identity
      # (author/committer noreply@anthropic.com). git resolves the identity
      # before this runs, so the guard resets the repo config to the session
      # operator and fails loud — the commit is re-run under the human. Closes
      # the session-timing gap that SessionStart alone cannot.
      run: node shared/tools/dev-cli/src/main.mjs ensure-commit-identity --check
    format:
      # Auto-format changed files, then re-stage what Prettier rewrote.
      run: pnpm nx format:write --uncommitted
      stage_fixed: true
    lint:
      # Lint only the projects affected by the staged changes.
      run: pnpm nx affected -t lint --uncommitted
    journey-workspace:
      # Journey markers (Rule 13) in files no nx project owns — root docs, the
      # subsystem-root CLAUDE.md files, .github, .claude — the per-project lint's
      # blind spot. Not affected-aware, so it lives outside `nx affected`.
      run: node shared/tools/dev-cli/src/main.mjs check-journey-markers-workspace
    doc-links:
      # Relative Markdown links across the repo must resolve to existing files.
      # Repo-wide (a link crosses project boundaries), so outside `nx affected`.
      run: node shared/tools/dev-cli/src/main.mjs check-doc-links
    command-refs:
      # Every `node .../main.mjs <command>` citation in a tracked Markdown file
      # must name a command main.mjs's COMMANDS registry still has — a rename
      # fails loud where a command is EXECUTED (lefthook, CI, a lint target),
      # but nothing else catches the prose that still tells someone to run the
      # old name. Repo-wide, like doc-links, so outside `nx affected`.
      run: node shared/tools/dev-cli/src/main.mjs check-command-refs
    doctrine:
      # The published tree must stay checkable by someone who was never here:
      # no round numbers or finding ids, no bet identifiers, and no citation of
      # a scenario/gate/ADR family whose owning document stayed behind — and no
      # published document the corpus map does not route to, and no inventory row
      # that neither links a document nor marks it withheld. Runs
      # repo-wide because it judges the tree as a whole, not a diff.
      run: node shared/tools/dev-cli/src/main.mjs check-doctrine
    roadmap-ids:
      # The roadmap's ids are what let a board card name exactly one item (§0).
      # Two rows drifting onto one id, or a row citing a track or gate that no
      # longer exists, breaks that silently — nothing renders wrong. Repo-wide
      # for the same reason as the gate above: it judges one document whole.
      run: node shared/tools/dev-cli/src/main.mjs check-roadmap-ids
    practice-index:
      # Every practice card must still find the rule text it cites. Edits to a
      # CLAUDE.md and edits to the index land in different projects, so no
      # per-project lint sees both sides — this belongs outside `nx affected`.
      run: node shared/tools/dev-cli/src/main.mjs check-practice-index
    dependency-cooldown:
      # Renovate holds back a direct dependency update until its release is old
      # enough; pnpm holds back everything the lock file resolves under it. The
      # two tools cannot read each other's file, so nothing but this gate
      # notices when one duration is edited and the other is not — and the
      # weaker half is the one that decides what actually gets installed.
      run: node shared/tools/dev-cli/src/main.mjs check-dependency-cooldown

pre-push:
  commands:
    verify:
      # Heavy deterministic gates, once per push: the definition-of-done minus
      # e2e (which needs Chromium/xvfb + built apps — CI stays its
      # authoritative home). typecheck is first-class here because the
      # Vite/esbuild build targets strip types without checking them. lint is
      # included even though pre-commit lints per commit: a commit made with
      # hooks bypassed (rebase, --no-verify) would otherwise reach CI unlinted.
      run: pnpm nx affected -t lint typecheck test build
    repo-gates:
      # The repo-wide dev-cli gates CI blocks on that no per-project target
      # carries — without them here, a red lands only on the PR (root
      # CLAUDE.md: "a shorter local run just moves the red to the PR").
      # check-contributor-record runs bare (no --author): the PR-author half
      # needs GitHub's account-type authority and stays CI-only by design.
      run: >-
        node shared/tools/dev-cli/src/main.mjs conformance &&
        node shared/tools/dev-cli/src/main.mjs check-claude-md &&
        node shared/tools/dev-cli/src/main.mjs check-subsystem-readmes &&
        node shared/tools/dev-cli/src/main.mjs check-subproject-readmes &&
        node shared/tools/dev-cli/src/main.mjs check-project-conventions &&
        node shared/tools/dev-cli/src/main.mjs check-contributor-record

prepare-commit-msg:
  commands:
    strip-agent-trailers:
      # Remove auto-appended "Co-Authored-By: Claude" / "Claude-Session:" lines
      # so commits stay under the human author with a clean message.
      #
      # `.claude/settings.json` > attribution now stops Claude Code from adding
      # them at all; this stays as the net that does not depend on one agent's
      # settings — a contributor on another tool, or a message typed by hand,
      # reaches the same clean commit.
      run: node shared/tools/dev-cli/src/main.mjs strip-claude-trailers {1}

commit-msg:
  commands:
    commitlint:
      # Tier 1: Conventional Commit shape + scope vocabulary (commitlint.config.mjs).
      run: pnpm commitlint --edit {1}
    scope-paths:
      # Tier 2: the scope must be the narrowest one covering every staged path
      # (see CONTRIBUTING.md). Best-effort under --amend/rebase; CI re-runs the
      # same check per PR commit as the authoritative net.
      run: node shared/tools/dev-cli/src/main.mjs check-commit-scope {1}
