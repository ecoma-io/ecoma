# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json
#
# cubic is the third reviewer on a pull request here, and the narrowest one.
# The division is by what each reviewer can SEE, not by preference:
#
#   1. Deterministic gates — `pnpm nx affected -t lint test typecheck build e2e`
#      plus every `dev-cli check-*` — own everything mechanically decidable.
#      They are the source of truth and the only thing that gates a merge.
#   2. `repo-care review-pr` owns the judgment layer no lint can reach. Its
#      rubric is DERIVED from `practice-index.json`, never authored twice, and
#      `dev-cli check-practice-index` fails when a cited rule is reworded away.
#      Advisory by definition; see `shared/tools/repo-care/CLAUDE.md`.
#   3. cubic owns what neither reaches: correctness defects in the changed code
#      — the bug hunt. `review-pr` deliberately does not do this, and no gate
#      can.
#
# **Holding that third boundary takes active work, because cubic's defaults
# push against it.** cubic auto-discovers context files with no configuration
# and no opt-out: every `CLAUDE.md` in the tree, `.claude/skills/`, the READMEs,
# `.github/`. Two of those skills — `preflight` and `conformance-review` — ARE
# review rubrics, so left alone cubic reads this workspace's practice rules and
# starts reporting against them, which is precisely `review-pr`'s job. The
# `custom_instructions` below are what neutralize that: they name the
# auto-discovered material and reclassify it from rubric to background.
#
# Linking `practice-index.json` from a custom rule would be the wrong repair in
# both directions. `custom_rules[].file_paths` concatenates a file INTO the
# review prompt as an enforceable instruction, so it would make cubic enforce
# the very rubric it must skip; and the field caps the description plus every
# linked file at 10,000 characters, under that file's own size. The exclusions
# below are therefore stated by CATEGORY, which is what keeps them true as cards
# are added — a per-card list would go stale into duplicate findings.
#
# The reasoning lives in this file rather than in a CLAUDE.md because no nested
# guidance loads for someone editing a root config file — the same reason each
# workflow in `.github/workflows` carries its own header.
#
# A maintainer can steer one review without touching this file, by commenting
# `@cubic-dev-ai rerun and focus on <…>` on the pull request.
#
# cubic is free for public repositories, so this costs nothing here. It reviews
# only this public tree; the withheld doctrine tier lives in another repository
# and is not in its reach.
version: 1

reviews:
  enabled: true

  # Mirrors `.github/workflows/pr-practice-review.yml`, which runs on
  # `synchronize` and skips drafts: both advisory reviewers wake on the same
  # events, so a maintainer never has to wonder which one has seen the newest
  # push, and a draft costs nothing.
  incremental_commits: true
  check_drafts: false

  # How picky the reviewer is; the vendor documents the knob but not what each
  # level changes, so this is a starting point to calibrate against real runs
  # rather than a derived value. `medium` because the value cubic adds is a bug
  # nobody else can find and `low` risks trading exactly that away, while two
  # advisory bots on one thread is already the noise ceiling — leaving `high`
  # nothing to spend but speculation.
  sensitivity: medium

  # A superseded finding must not read as an open one. `review-pr` gets the same
  # property by editing its single marker comment in place rather than stacking.
  resolve_threads_when_addressed: true

  # Advisory, exactly like `review-pr`. Nothing here may approve a pull request
  # or stand in for the required checks in `ci.yml`.
  auto_approve: disabled

  # The architecture story is told by the doctrine tree and by each project's
  # CLAUDE.md, both of which outlive any one pull request. A generated diagram is
  # comment volume with no owner and no gate keeping it true.
  architecture_diagrams: false

  custom_instructions: |
    You are the bug hunter on this repository. Report defects in the changed
    code: wrong logic, unhandled null or undefined, swallowed or misclassified
    errors, await and promise mistakes, unreleased resources, race conditions,
    off-by-one and boundary errors, incorrect use of a library or platform API,
    and untrusted input reaching a dangerous sink unvalidated.

    Two other reviewers already cover everything else, so a finding outside that
    scope is a duplicate — and a duplicate costs a maintainer the same attention
    as a wrong one. Report NONE of the following:

    - Formatting and style. Prettier and ESLint decide these and CI fails on
      them, so such a comment is noise on an already-red build.
    - Test quality and test presence: assertions that are too weak, a test whose
      title promises more than it checks, behavior changed without a test, a
      stub returning a fabricated success, coverage percentages.
    - Documentation quality, agreement between README language variants, comment
      wording, names that describe how code came to be rather than what it is,
      and commit message form.
    - Refactor hygiene and design taste: unrelated cleanup mixed into a focused
      change, a hand-rolled helper duplicating a built-in, a hardcoded value that
      could be derived, and whether the pull request description matches the
      diff.

    That list names CATEGORIES, not individual rules, so that it keeps holding
    as the other reviewer's rubric grows.

    You will pick up this repository's context files automatically, and that is
    the one place they will mislead you. The root `CLAUDE.md`, every project's
    own `CLAUDE.md`, and the review procedures under `.claude/skills/` —
    `preflight` and `conformance-review` above all — ARE the other reviewer's
    rubric, written out in full. Read all of it: it describes provider errors
    that arrive as HTTP 200, tools that must run on bare node, boundaries no
    lint reads, and that knowledge is what lets you tell correct code from
    incorrect code here. But never report a deviation from it. If the only
    reason you would flag something is that a CLAUDE.md or a skill says so, drop
    the finding.

  ignore:
    files:
      # Prose. `review-pr`'s parity and documentation checks, plus `dev-cli`'s
      # doc gates, own every markdown file in the tree.
      - "**/*.md"
      # Generated or resolved, never hand-edited.
      - pnpm-lock.yaml
      - go.work.sum
      - Cargo.lock
      - "**/dist/**"
      - "**/coverage/**"
      - cubic.yaml

  # Five slots, the plan's cap. None restates a rule `practice-index.json`
  # already carries — a second copy would drift with nothing to catch it. Each
  # names a failure mode that is SILENT (it produces a green build), EXPENSIVE,
  # and unreachable by every gate in this workspace. Each opens with what to
  # flag, because the vendor's guidance for these is to be explicit before
  # explanatory.
  custom_rules:
    - name: Bare-node tooling stays dependency-free
      description: >
        Flag any import of a module outside `node:` builtins and the tool's own
        files added to a non-test source file under `shared/tools/repo-care` or
        `shared/tools/dev-cli/src`. `repo-care` is invoked by GitHub Actions as
        `node <path>` with no install step and has no package.json at all;
        `dev-cli` is a published package that declares no dependencies and is
        spawned by those same workflows. Such an import therefore crashes the
        workflow at import time — and nothing catches it first, because the test
        runner resolves modules from the root install that the workflow never
        performs.
      include:
        - shared/tools/repo-care/**
        - shared/tools/dev-cli/src/**
      exclude:
        - "**/*.test.mjs"
        - "**/*.integration.test.mjs"

    - name: Untrusted text is rendered, never concatenated
      description: >
        Flag any GitHub comment body assembled in `shared/tools/repo-care` from
        text the tool did not author — issue and pull request titles and bodies,
        comment bodies, model output, file contents fetched at a pull request
        head — unless that text passes through `sanitizeTranslation`, or through
        `review-pr`'s `renderText` and `renderPath` wrappers when the value lands
        inside a single heading, list item, or code span. Flag a new helper that
        reimplements those rules instead of calling them. Text placed into a
        comment directly can forge another job's marker comment and hijack that
        job's in-place edit, close a `<details>` container early, or re-ping
        people on every run.
      include:
        - shared/tools/repo-care/**

    - name: pull_request_target never executes head code
      description: >
        In any workflow triggered by `pull_request_target`, flag a `ref:` naming
        the pull request head, a `run:` step consuming head-controlled input, an
        install or build step after head files are restored, and any action
        referenced by tag or branch rather than a full commit SHA. Such a
        workflow runs against the base ref holding a write token, so head content
        may be read through the API as DATA and never executed.
      include:
        - .github/workflows/**

    - name: Nx target inputs replace the defaults
      description: >
        Flag a target that declares its own `inputs` without restating the
        defaults that still apply to it — `default` and `coverageConfig` — and a
        target that SPAWNS a workspace tool without naming that tool in those
        same `inputs`. Declaring `inputs` REPLACES the list from `nx.json`'s
        `targetDefaults` rather than merging with it, so a dropped
        `coverageConfig` replays a cached green after the coverage floor is
        raised; and `implicitDependencies` feeds `nx affected` only, never the
        task hash, so without the input a changed tool replays a stale result.
      include:
        - "**/project.json"
        - nx.json

    - name: Polyglot dependency boundaries are review-only
      description: >
        Flag any added cross-project import in a Go, Rust or Python file whose
        direction the `tags` in the importing and imported `project.json` forbid:
        `license:apache` must never import `license:sul` (it would hand a third
        party SUL code under Apache terms, which cannot be granted and cannot be
        undone), a product domain may depend only on its own libraries
        and on `shared/*`, `shared/*` never reaches into a product domain, and
        domains never import each other. `@nx/enforce-module-boundaries` sees
        only what ESLint parses, so in these languages nothing enforces the
        constraints declared in `eslint.config.mjs`.
      include:
        - "**/*.go"
        - "**/*.rs"
        - "**/*.py"

pr_descriptions:
  # The pull request template's checkboxes are COMPUTED by `dev-cli pr-facts`
  # from the change itself. A generated description would restate them as prose
  # those facts do not back, and `review-pr`'s description-versus-diff check
  # would then be judging cubic's writing rather than the author's claim.
  generate: false

issues:
  # No agent pushes commits here. A commit landing outside the normal flow skips
  # the definition of done and arrives with a message commitlint rejects, since
  # the scope must match the changed paths. Findings are for humans to act on.
  fix_with_cubic_buttons: false
  pr_comment_fixes: false
  fix_commits_to_pr: false
