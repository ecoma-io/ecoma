# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json
#
# cubic is the third reviewer on a pull request here, and the narrowest one.
# The division is by what each reviewer can SEE, not by preference:
#
#   1. Deterministic gates — `pnpm nx affected -t lint test typecheck build e2e`
#      plus every `dev-cli check-*` — own everything mechanically decidable.
#      They are the source of truth and the only thing that gates a merge.
#   2. `repo-care review-pr` owns the judgment layer no lint can reach. Its
#      rubric is DERIVED from `practice-index.json`, never authored twice, and
#      `dev-cli check-practice-index` fails when a cited rule is reworded away.
#      Advisory by definition; see `shared/tools/repo-care/CLAUDE.md`.
#   3. cubic owns what neither reaches: correctness defects in the changed code
#      — the bug hunt. `review-pr` deliberately does not do this, and no gate
#      can.
#
# The reasoning lives in this file rather than in a CLAUDE.md because no nested
# guidance loads for someone editing a root config file — the same reason each
# workflow in `.github/workflows` carries its own header.
#
# Every setting below exists to hold that boundary. A cubic finding that another
# reviewer would also have made is a defect in THIS file, not a bonus: it costs a
# maintainer the same attention as a wrong finding.
#
# cubic is free for public repositories, so this costs nothing here. It reviews
# only this public tree; the withheld doctrine tier lives in another repository
# and is not in its reach.
version: 1

reviews:
  enabled: true

  # Mirrors `.github/workflows/pr-practice-review.yml`, which runs on
  # `synchronize` and skips drafts: both advisory reviewers wake on the same
  # events, so a maintainer never has to wonder which one has seen the newest
  # push, and a draft costs nothing.
  incremental_commits: true
  check_drafts: false

  # `medium`. The value cubic adds is a bug nobody else can find, and `low`
  # trades exactly that away. Two advisory bots on one thread is already the
  # noise ceiling, so `high` would spend the remaining attention on speculation.
  sensitivity: medium

  # A superseded finding must not read as an open one. `review-pr` gets the same
  # property by editing its single marker comment in place rather than stacking.
  resolve_threads_when_addressed: true

  # Advisory, exactly like `review-pr`. Nothing here may approve a pull request
  # or stand in for the required checks in `ci.yml`.
  auto_approve: disabled

  # The architecture story is told by the doctrine tree and by each project's
  # CLAUDE.md, both of which outlive any one pull request. A generated diagram is
  # comment volume with no owner and no gate keeping it true.
  architecture_diagrams: false

  custom_instructions: |
    You are the bug hunter on this repository. Report defects in the changed
    code: wrong logic, unhandled null or undefined, swallowed or misclassified
    errors, await and promise mistakes, unreleased resources, race conditions,
    off-by-one and boundary errors, incorrect use of a library or platform API,
    and untrusted input reaching a dangerous sink unvalidated.

    Do NOT report any of the following. Each already has an owner, and a
    duplicate finding costs a maintainer the same attention as a wrong one:

    - Formatting and style. Prettier and ESLint decide these and CI fails on
      them, so a comment about them is noise on an already-red build.
    - Anything the rubric in `practice-index.json` covers. Read that file — it
      is the live list, so do not work from this summary of it. It belongs to
      another reviewer and spans weakened or thin tests, behavior changed
      without a test, disguised stubs, unrelated refactoring mixed into a
      focused change, boilerplate documentation, description-versus-diff
      mismatch, journey markers in comments and names, hand-rolled code a
      built-in already does, unjustified hardcoded values, and README language
      parity.
    - Missing or wrong documentation, README translations, and commit message
      form. `dev-cli` gates all three in CI.
    - Test coverage percentages. Every test target reads one shared floor from
      `coverage.config.json`.

    Context, not rubric: the root `CLAUDE.md` and each project's own `CLAUDE.md`
    describe how this codebase actually works — provider errors that arrive as
    HTTP 200, tools that must run on bare node, boundaries no lint reads. Read
    them to judge whether changed code is CORRECT here. Never report a
    deviation from them as a finding; that is the other reviewer's rubric.

  ignore:
    files:
      # Prose. `review-pr`'s parity and documentation checks, plus `dev-cli`'s
      # doc gates, own every markdown file in the tree.
      - "**/*.md"
      # Generated or resolved, never hand-edited.
      - pnpm-lock.yaml
      - go.work.sum
      - Cargo.lock
      - "**/dist/**"
      - "**/coverage/**"
      - cubic.yaml

  # Five slots, and none of them restates a rule `practice-index.json` already
  # carries — a second copy would drift with nothing to catch it. Each names a
  # failure mode that is SILENT (it produces a green build), EXPENSIVE, and
  # unreachable by any gate in this workspace.
  custom_rules:
    - name: Bare-node tooling stays dependency-free
      description: >
        `shared/tools/repo-care` is invoked by GitHub Actions as `node <path>`
        with no install step and has no package.json at all; `shared/tools/dev-cli`
        is a published package that declares no dependencies and is spawned by
        those same workflows. An import of anything outside `node:` builtins and
        the tool's own files therefore crashes the workflow at import time — and
        nothing catches it first, because the test runner resolves modules from
        the root install that the workflow never performs. Flag any added
        non-builtin import in a non-test source file of either tool.
      include:
        - shared/tools/repo-care/**
        - shared/tools/dev-cli/src/**
      exclude:
        - "**/*.test.mjs"
        - "**/*.integration.test.mjs"

    - name: Untrusted text is rendered, never concatenated
      description: >
        In `shared/tools/repo-care`, any text the tool did not author — issue and
        pull request titles and bodies, comment bodies, model output, and file
        contents fetched at a pull request head — must pass through
        `sanitizeTranslation`, or through `review-pr`'s `renderText` and
        `renderPath` wrappers when the value lands inside a single heading, list
        item, or code span. Placing such text into a comment body directly lets
        it forge another job's marker comment and hijack that job's in-place
        edit, close a `<details>` container early, or re-ping people on every
        run. Flag any new comment body built from such text without those
        helpers, and any new helper that reimplements their rules instead of
        calling them.
      include:
        - shared/tools/repo-care/**

    - name: pull_request_target never executes head code
      description: >
        A workflow triggered by `pull_request_target` runs against the base ref
        holding a write token. It may read pull request head content through the
        API as DATA, but must never check it out, execute it, install from it, or
        interpolate it into a shell command. Flag a `ref:` naming the head, a
        `run:` step consuming head-controlled input, an install or build step
        after head files are restored, and any action referenced by tag or branch
        rather than a full commit SHA.
      include:
        - .github/workflows/**

    - name: Nx target inputs replace the defaults
      description: >
        Declaring `inputs` on a target REPLACES the list from `nx.json`'s
        `targetDefaults` rather than merging with it, so a target that declares
        its own must restate every default that still applies — `default` and
        `coverageConfig`. Dropping `coverageConfig` that way replays a cached
        green after the coverage floor is raised. Separately, a target that
        SPAWNS a workspace tool has to name that tool in its own `inputs`:
        `implicitDependencies` feeds `nx affected` only, never the task hash, so
        without it a changed tool replays a stale cached result.
      include:
        - "**/project.json"
        - nx.json

    - name: Polyglot dependency boundaries are review-only
      description: >
        `@nx/enforce-module-boundaries` sees only what ESLint parses, so for Go,
        Rust and Python NOTHING enforces the tag constraints declared in
        `eslint.config.mjs`. Judge every added cross-project import in these
        languages against the `tags` in the importing and imported
        `project.json`: `license:sul` must never import `license:ee` (it would
        ship paid code to every self-hoster), a product domain may depend only on
        its own libraries and on `shared/*`, `shared/*` never reaches into a
        product domain, and domains never import each other.
      include:
        - "**/*.go"
        - "**/*.rs"
        - "**/*.py"

pr_descriptions:
  # The pull request template's checkboxes are COMPUTED by `dev-cli pr-facts`
  # from the change itself. A generated description would restate them as prose
  # those facts do not back, and `review-pr`'s description-versus-diff check
  # would then be judging cubic's writing rather than the author's claim.
  generate: false

issues:
  # No agent pushes commits here. A commit landing outside the normal flow skips
  # the definition of done and arrives with a message commitlint rejects, since
  # the scope must match the changed paths. Findings are for humans to act on.
  fix_with_cubic_buttons: false
  pr_comment_fixes: false
  fix_commits_to_pr: false
