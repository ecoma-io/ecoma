<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="pwu-title pwu-desc">
  <title id="pwu-title">Anatomy of a public web URL</title>
  <desc id="pwu-desc">The public URL model /locale/mount/path split into its three labeled segments, with the example /en/docs/getting-started.</desc>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

  <defs>
    <style>
      .seg-locale  { fill: #0f172a; }
      .seg-mount   { fill: #1e293b; }
      .seg-path    { fill: #334155; }
      .label       { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono        { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    </style>
  </defs>

  <!-- Heading -->
  <text x="360" y="42" text-anchor="middle" class="label" font-size="19" font-weight="700" fill="#0f172a">Anatomy of a public web URL</text>
  <text x="360" y="64" text-anchor="middle" class="label" font-size="13" fill="#64748b">Every public page lives under one strict model</text>

  <!-- URL construction: three segment boxes -->
  <!-- locale segment -->
  <rect x="100" y="100" width="120" height="56" rx="8" fill="#0f172a"/>
  <text x="160" y="134" text-anchor="middle" class="mono" font-size="22" font-weight="700" fill="#f8fafc">/en</text>

  <!-- mount segment -->
  <rect x="232" y="100" width="130" height="56" rx="8" fill="#334155"/>
  <text x="297" y="134" text-anchor="middle" class="mono" font-size="22" font-weight="700" fill="#f8fafc">/docs</text>

  <!-- path segment -->
  <rect x="374" y="100" width="246" height="56" rx="8" fill="#64748b"/>
  <text x="497" y="134" text-anchor="middle" class="mono" font-size="22" font-weight="700" fill="#f8fafc">/getting-started</text>

  <!-- Segment labels below the boxes -->
  <text x="160" y="180" text-anchor="middle" class="label" font-size="14" font-weight="600" fill="#0f172a">locale</text>
  <text x="160" y="198" text-anchor="middle" class="label" font-size="11" fill="#64748b">first segment, always present</text>

  <text x="297" y="180" text-anchor="middle" class="label" font-size="14" font-weight="600" fill="#0f172a">mount</text>
  <text x="297" y="198" text-anchor="middle" class="label" font-size="11" fill="#64748b">the public application</text>

  <text x="497" y="180" text-anchor="middle" class="label" font-size="14" font-weight="600" fill="#0f172a">path</text>
  <text x="497" y="198" text-anchor="middle" class="label" font-size="11" fill="#64748b">opaque to the platform</text>

  <!-- Connector lines from boxes to labels -->
  <line x1="160" y1="156" x2="160" y2="166" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="297" y1="156" x2="297" y2="166" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="497" y1="156" x2="497" y2="166" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Rule: full path template -->
  <rect x="150" y="232" width="420" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="261" text-anchor="middle" class="mono" font-size="19" font-weight="600" fill="#0f172a">/&lt;locale&gt;/&lt;mount&gt;/&lt;path&gt;</text>

  <!-- Concrete examples -->
  <text x="360" y="312" text-anchor="middle" class="label" font-size="12" font-weight="600" fill="#475569">EXAMPLES</text>

  <rect x="120" y="326" width="230" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="235" y="351" text-anchor="middle" class="mono" font-size="15" fill="#0f172a">/en/docs/getting-started</text>

  <rect x="370" y="326" width="230" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="485" y="351" text-anchor="middle" class="mono" font-size="15" fill="#0f172a">/vi/docs/getting-started</text>

  <!-- Footer note -->
  <text x="360" y="388" text-anchor="middle" class="label" font-size="11" fill="#64748b">locale: en | vi — mount: blog | docs | docs/api — path: owned by the application</text>
</svg>
