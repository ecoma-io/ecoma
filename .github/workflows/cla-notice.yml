name: CLA notice

on:
  # `pull_request_target`, for the same reason as pr-practice-review and
  # translate-pr: a fork pull request's `pull_request` token is read-only, so a
  # job under that trigger could never post the comment this one exists for —
  # and first-time contributors, the entire audience of a CLA notice, arrive
  # from forks. The trigger is safe here under the same boundary those jobs
  # hold: nothing from the pull request head is ever executed. Since the CLA
  # action records signatures onto the base branch, nothing from the head has to
  # be read as data either — every file this job judges is the trusted base
  # version, which also means a pull request editing `CODEOWNERS` cannot exempt
  # its own author in this job's verdict.
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

# A rapid push supersedes the in-flight run: only the newest head decides what
# the notice should say.
concurrency:
  group: cla-notice-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # NOT a required check, deliberately: ci.yml's `Contributor signature` step is
  # the gate. This job is its messenger — it re-runs the same dev-cli command
  # and turns a red log line into a comment that tells the author exactly what
  # to do. It exits non-zero only when it could not do its own job.
  #
  # What it explains has narrowed to the half `cla.yml` does not: the CLA
  # action posts its own thread comment naming the sentence to sign, so a notice
  # repeating that would be two bots asking for the same thing. The sign-off
  # trailer has no such messenger, and it is the red a contributor is most
  # likely to hit after signing.
  notice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No `ref:` here, deliberately — the default under this trigger is the
      # base branch, the trusted copy, and naming any `github.event.pull_request`
      # ref would trip Scorecard's dangerous-workflow check (see
      # pr-practice-review.yml). Full history because the gate judges the pull
      # request's own commits for their `Signed-off-by` trailers, which needs
      # both endpoints of the range reachable; a shallow clone would leave the
      # merge base unresolvable and the range empty.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # The head's commits, as data — read by `git log`, never executed. The
      # signatures the gate judges need no fetching: the CLA action commits them
      # to the base branch, so this checkout already carries them, which is what
      # let the merge-result reconstruction this job used to do go away with the
      # committed-record flow it existed for.
      - name: Fetch the pull request's commits
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin \
            "+refs/pull/$NUMBER/head:refs/prq/head" \
            "+refs/heads/$BASE_REF:refs/prq/base"

      # repo-care and dev-cli both run on bare node (dependency-free by
      # design): no pnpm install.
      - name: Tell the author what the CLA gate wants, on the thread
        run: >
          node shared/tools/repo-care/src/main.mjs cla-notice
          --pr "$PR" --author "$PR_AUTHOR" --author-type "$PR_AUTHOR_TYPE"
          --commits refs/prq/base..refs/prq/head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
