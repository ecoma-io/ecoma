name: Issue triage

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to (re-)triage
        required: true

permissions:
  contents: read
  issues: write

jobs:
  triage:
    # A bot's issue is machine state, not backlog to classify: Renovate's
    # Dependency Dashboard reopens itself whenever anything closes it, and each
    # reopen would spend a three-model quorum deciding the "area" of a checkbox
    # list. `user.type` is GitHub's own answer and the same authority ci.yml
    # asks who needs a contributor record — a `[bot]` suffix is a guess. A
    # `workflow_dispatch` run carries no issue payload, so re-triaging any issue
    # by hand still works.
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # repo-care is deliberately dependency-free (bare node, global fetch),
      # so no pnpm install — the whole job stays seconds-cheap per issue.
      - name: Triage the issue
        run: node shared/tools/repo-care/src/main.mjs triage-issue --issue "$ISSUE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
