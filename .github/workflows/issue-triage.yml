name: Issue triage

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to (re-)triage
        required: true

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # repo-care is deliberately dependency-free (bare node, global fetch),
      # so no pnpm install — the whole job stays seconds-cheap per issue.
      - name: Triage the issue
        run: node shared/tools/repo-care/src/main.mjs triage-issue --issue "$ISSUE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
