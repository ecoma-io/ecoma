name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, independent of push/PR activity: catches new findings a query-pack
  # update surfaces against code that itself never changed.
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

# Same split as ci.yml: a push to main gets a run of its own per commit, a new
# push to a PR supersedes the in-flight run for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only this job uploads SARIF, so the write stays here rather than at the
    # top level -- any job added later starts read-only instead of inheriting
    # it (same shape as scorecard.yml). Job-level `permissions` REPLACES the
    # workflow-level block rather than merging with it, so `contents: read` has
    # to be restated: omit it and checkout loses read access to the repository.
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      # Languages analyzed: javascript-typescript, go (go.work declares the
      # platform/ engine modules), and actions.
      #
      # `actions` needs a leg of its own even though the workflow files are
      # already IN the javascript-typescript database -- that invocation
      # extracts them (its log names the count it scanned) and then interprets
      # `js/*` queries and nothing else. So without this leg every
      # workflow-security query runs zero times: expression injection of
      # `github.event.*` into a `run:` block, untrusted checkout under
      # `pull_request_target`, artifact poisoning, a job with no
      # `permissions:`. Three workflows here run under `pull_request_target`
      # holding a write token, which is the exact shape those queries police,
      # and reviewing them by eye is the thing a query pack exists to replace.
      #
      # Rust and Python have no leg. The Cargo workspace does have a member
      # (rba-desktop), so `rust` is a real candidate -- it stays out until a
      # `build-mode: none` extraction is proven against a Tauri crate on a
      # runner, because a leg that cannot extract turns CodeQL red on code it
      # has never analyzed once. Python has no project at all yet.
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: autobuild
          # `none` is the only mode `actions` has: workflow files are read as
          # data, never built.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same derivation as ci.yml: the Go version comes from go.work's own
      # pin, never a second copy. Only the Go leg needs the toolchain.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.work
          cache: false # no root go.sum yet; enable with the first Go dependency

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          category: "/language:${{ matrix.language }}"
