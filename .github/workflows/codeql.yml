name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, independent of push/PR activity: catches new findings a query-pack
  # update surfaces against code that itself never changed.
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

# Same split as ci.yml: a push to main gets a run of its own per commit, a new
# push to a PR supersedes the in-flight run for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only this job uploads SARIF, so the write stays here rather than at the
    # top level -- any job added later starts read-only instead of inheriting
    # it (same shape as scorecard.yml). Job-level `permissions` REPLACES the
    # workflow-level block rather than merging with it, so `contents: read` has
    # to be restated: omit it and checkout loses read access to the repository.
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      # Languages analyzed: javascript-typescript, and go (go.work declares
      # the platform/ engine modules). Rust's Cargo workspace still declares
      # zero members and no Python project exists yet -- add a matrix leg for
      # each once a real project lands in that language.
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: autobuild
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same derivation as ci.yml: the Go version comes from go.work's own
      # pin, never a second copy. Only the Go leg needs the toolchain.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.work
          cache: false # no root go.sum yet; enable with the first Go dependency

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:${{ matrix.language }}"
