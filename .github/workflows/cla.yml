name: CLA

on:
  # Two triggers because a signature arrives as a comment and a pull request
  # arrives as a pull request. `pull_request_target`, not `pull_request`, for
  # the same reason as cla-notice and pr-practice-review: a fork pull request's
  # `pull_request` token is read-only, and first-time contributors — the entire
  # audience of a CLA check — arrive from forks. The boundary that makes the
  # trigger safe is the same one those jobs hold: nothing from the pull request
  # head is ever checked out or executed. This job runs one third-party action
  # pinned by commit, plus dev-cli from the base branch.
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  # Read, and only read, which is not the obvious shape for a workflow whose
  # whole job is to write a signature into this repository.
  #
  # The write happens under a GitHub App's installation token, minted in the
  # job below, and the reason is a hard limit rather than a preference:
  # `github-actions[bot]` CANNOT be added to a ruleset's bypass list. It is not
  # selectable in the UI and no integration id is accepted over the API —
  # GitHub keeps its own Actions token non-bypassable on purpose, so that write
  # access to this file never becomes write access past every rule. A bypass
  # list takes repository roles, teams, GitHub Apps and deploy keys; this token
  # is none of them. Granting `contents: write` here would therefore buy a
  # permission that still cannot commit to a protected default branch, while
  # handing every step in this job more authority than it needs.
  #
  # So the only thing the default token does here is check the repository out.
  # What the App needs instead is listed beside the token it mints.
  contents: read

concurrency:
  group: cla-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `recheck` is the action's own re-run word; the sign comment is derived
    # below rather than matched here, so this guard only has to be wide enough
    # to let a candidate comment reach the step that knows the sentence. Any
    # pull_request_target event runs unconditionally.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request != null && github.event.comment.body != '')
    steps:
      # The App comes first because everything after it writes with the token
      # it mints — including `git push` in the last step, which authenticates
      # through the credential this job's checkout persists.
      #
      # The guard exists because the failure it replaces is unreadable: without
      # it a missing secret surfaces as a generic "input required" from an
      # action whose name says nothing about why this repository needs an App.
      - name: Require the app credentials this workflow cannot work without
        env:
          APP_ID: ${{ secrets.CLA_APP_ID }}
        run: |
          [ -n "$APP_ID" ] || {
            echo "::error::CLA_APP_ID and CLA_APP_PRIVATE_KEY are not set. Recording a signature means committing to a protected branch, which the Actions token cannot do and cannot be granted. See .github/repository-settings.json > notAppliedYet.claAppBypassAndSecrets."
            exit 1
          }

      # No app id appears in this file (Rule 14). Both halves come from
      # secrets, so rotating the key — or moving to a different App — is a
      # settings change and never a code change.
      - name: Mint the installation token that may write to a protected branch
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CLA_APP_ID }}
          private-key: ${{ secrets.CLA_APP_PRIVATE_KEY }}

      # No `ref:` — the default under `pull_request_target` is the base branch,
      # the trusted copy, and naming a `github.event.pull_request` ref would
      # trip Scorecard's dangerous-workflow check (see pr-practice-review.yml).
      #
      # `token:` and the persisted credential are both deliberate, and both are
      # departures from the `persist-credentials: false` this repository uses
      # everywhere else. The last step commits CONTRIBUTORS.md and pushes it,
      # and a push needs a credential on disk; leaving the default token here
      # would persist one that cannot write to a protected branch anyway. The
      # exposure that convention normally guards against does not arise: this
      # job never checks out or executes anything from the pull request head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # Rule 14 rung 1, and the reason this workflow carries no sentence of its
      # own: the words a contributor must post are `CLA.md`'s, read out of the
      # fenced block under "How you agree" — the same read `check-contributor-
      # record` makes. A sentence written here as a literal would be a second
      # contract nobody knows they are signing, and it would keep matching after
      # the agreement's own wording moved. The allowlist is derived the same
      # way, from `CODEOWNERS` and the automation config committed here, so the
      # action's status and CI's required check cannot disagree about who is
      # exempt. dev-cli runs on bare node (dependency-free by design): no
      # pnpm install.
      - name: Derive the sign comment and the allowlist from CLA.md
        id: cla
        run: |
          {
            echo "sentence<<CLA_SENTENCE_EOF"
            node shared/tools/dev-cli/src/main.mjs check-contributor-record --sign-comment
            echo "CLA_SENTENCE_EOF"
            echo "allowlist=$(node shared/tools/dev-cli/src/main.mjs check-contributor-record --allowlist)"
          } >> "$GITHUB_OUTPUT"

      # contributor-assistant/github-action, pinned by commit at v2.6.1.
      #
      # **The upstream repository is archived** (read-only since 2026-03) and
      # that is a known, accepted cost rather than an oversight. It was still
      # the better of the two candidates: it stores each signature as a commit
      # in THIS repository, where the agreement's writing requirement is
      # satisfied by an artifact the project controls and every clone carries,
      # and it needs no third-party service standing between a contributor and
      # a licence contract. `cla-bot` is the opposite on both counts — a hosted
      # app that stores no signature at all, checking instead against an
      # allowlist a maintainer curates by hand, which is the very ceremony this
      # workflow exists to remove.
      #
      # An archived action pinned by commit is a frozen artifact, not a rotting
      # one: nothing about it changes under us. What it costs is that a GitHub
      # API change eventually breaks it with nobody upstream to fix it. The exit
      # is a fork — the code is Apache-2.0 and the README invites it — and the
      # blast radius is bounded, because everything the project needs to keep is
      # already in the tree: the signatures file, and `CLA.md` itself.
      - name: Record the signature and set the check
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          # Every call the action makes rides this token, so the app — not this
          # workflow — is what needs `contents: write` (the signature commit),
          # `pull-requests: write` (the comment), `statuses: write` (the check)
          # and `actions: write` (the re-run on `recheck`). That is also why the
          # workflow's own `permissions:` block asks for read and nothing more.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          # Read by `check-contributor-record` off this very input, so the gate
          # and the writer can never point at different generations. Publishing
          # a new CLA version moves this path to the next generation and asks
          # everyone to sign again — which is exactly what `CLA.md` > "If these
          # terms change" promises, and the previous file stays in the tree as
          # the writing for everything merged under it.
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/ecoma-io/ecoma/blob/main/CLA.md"
          branch: "main"
          allowlist: ${{ steps.cla.outputs.allowlist }}
          custom-pr-sign-comment: ${{ steps.cla.outputs.sentence }}
          custom-notsigned-prcomment: >-
            Thank you for the pull request. Ecoma offers its code under more than one set of
            terms, so we need a licence broad enough to do that for your contribution too —
            that is what the
            [Contributor License Agreement](https://github.com/ecoma-io/ecoma/blob/main/CLA.md)
            grants. It is a licence, not ownership: you keep the copyright in your work.
            You agree **once**, and it covers every future contribution.
            <br/>Post the line below as a comment on this pull request. Before we merge, a
            maintainer will ask you privately for the full legal name, country of residence,
            postal address and contact email the governing law requires us to hold — none of
            those are published, and none of them are needed to open a pull request.
            <br/>Separately, every commit needs a <code>Signed-off-by</code> trailer
            (<code>git commit -s</code>) — that is the Developer Certificate of Origin, and
            <code>CLA.md</code> explains why it is deliberately not how you agree to this.<br/>
          # Locks the thread after merge so a signature comment cannot be edited
          # or deleted out from under the grant it evidences. The signatures file
          # and its commit would survive either way; this keeps the comment the
          # file points at readable too.
          lock-pullrequest-aftermerge: true

      # `CLA.md` clause 3.2 makes CONTRIBUTORS.md how the project names an
      # author, and the contributor consents to modification of their work on
      # the strength of it — so the row is the project's side of the bargain,
      # not a step to hand a first-time contributor. It is added here, from the
      # signature the step above just committed, which is why the tree is
      # re-read rather than reused.
      # The push below lands on the same protected branch as the signature, so
      # it rides the same App: the checkout above persisted that credential,
      # which is what `git push` picks up. The identity is the App's too — a
      # commit attributed to `github-actions[bot]` here would name an actor
      # that provably could not have made it.
      - name: Credit the signatory in CONTRIBUTORS.md
        if: github.event_name == 'issue_comment'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Read from the token step rather than written here, so the author
          # cannot drift from whichever App actually holds the bypass. The
          # numeric `<id>+slug[bot]@…` form is skipped deliberately: it buys an
          # avatar link and costs an API call for an id nothing else needs.
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git fetch --no-tags --depth=1 origin main
          git checkout -B main FETCH_HEAD
          node shared/tools/dev-cli/src/main.mjs sync-contributors \
            --signatures signatures/version1/cla.json
          if ! git diff --quiet -- CONTRIBUTORS.md; then
            git config user.name "$APP_SLUG[bot]"
            git config user.email "$APP_SLUG[bot]@users.noreply.github.com"
            git commit -s -m "chore(workspace): credit a new signatory in CONTRIBUTORS.md" \
              -m "CLA.md clause 3.2 names CONTRIBUTORS.md as how the project credits an author, so the row is owed from the moment a signature exists." \
              -- CONTRIBUTORS.md
            git push origin main
          fi
