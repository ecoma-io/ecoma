name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Run every project instead of the affected set'
        type: boolean
        required: false
        default: false
  # Đường chạy TOÀN BỘ repository trên main không cần con người (issue #264,
  # phương án 1 - khuyến nghị): hằng đêm chạy full run-many thay vì affected.
  # GitHub chỉ chạy schedule trên branch mặc định (main). Affected set giữ cho
  # pull_request/merge_group/push để không tăng latency review; "main xanh"
  # trên một tập affected không chứng minh được gì về toàn bộ repository - một
  # lỗ hổng trong tính affected set chỉ lộ ở lần chạy đầy đủ này.
  schedule:
    # Tránh phút đúng giờ (00): tài liệu GitHub ("Troubleshooting scheduled
    # workflows") nêu schedule có thể bị delay/trượt bỏ hoàn toàn lúc tải cao,
    # và khuyến nghị tránh giờ tròn — cron `0 3 * * *` chưa bao giờ kích kể từ
    # khi landed (#296); PM workflow của repo này cũng đo được độ trễ 7-8 giờ.
    - cron: '17 3 * * *'

permissions:
  contents: read

env:
  # Self-hosted Nx remote cache (#592, docs/applications/remote-cache/03-operations.md §4).
  # Composite action `run-nx-target` forwards these into NX_SELF_HOSTED_REMOTE_CACHE_*.
  # Org secrets are invisible to fork PRs by GitHub design; the pull_request job env
  # carries only what the pull_request target grants, and read-only access from PR
  # builds is deliberately not wired (02-delivery.md §6 rule 1/10: PR/fork gets no
  # cache credential).
  ECOMA_NX_CACHE_SERVER: ${{ secrets.ECOMA_NX_CACHE_SERVER }}
  ECOMA_NX_CACHE_ACCESS_TOKEN: ${{ secrets.ECOMA_NX_CACHE_ACCESS_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Start runner resource monitoring
        continue-on-error: true
        uses: Garbee/runner-resource-usage@5d478275bca9b56badaca884f6e3858085e2ca18 # main HEAD (upstream chưa có tag)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Check PR title
        if: github.event_name == 'pull_request'
        run: pnpm dx pr-check
      - name: Format check
        if: github.event_name == 'pull_request'
        run: npx oxfmt --check .
      - name: Architecture tag validation
        run: pnpm dx arch-check
      # `force` chỉ tồn tại với workflow_dispatch; mọi trigger khác để nó rỗng và
      # `!inputs.force` ra `true`, nên PR/push vẫn chạy theo affected như cũ.
      # Khi dispatch với force=true thì affected=false → action rơi sang `run-many`.
      # Riêng `schedule` luôn affected=false (điều kiện `github.event_name !=
      # 'schedule'`): đường chạy toàn bộ repository mỗi đêm, issue #264.
      - name: Linting
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/run-nx-target
        with:
          targets: lint
          threads: '6'
          affected: ${{ !inputs.force && github.event_name != 'schedule' }}
      - name: Type check
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/run-nx-target
        with:
          targets: typecheck
          threads: '3'
          affected: ${{ !inputs.force && github.event_name != 'schedule' }}
      - name: Unit test
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/run-nx-target
        with:
          targets: test
          threads: '1'
          affected: ${{ !inputs.force && github.event_name != 'schedule' }}
      - name: README contract check
        if: github.event_name == 'pull_request'
        run: pnpm dx readme-check

  integration-test:
    name: integration-test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # PostgreSQL thật cho các suite `test-integration` của `apps/account`,
    # `auth-infrastructure` và `apps/auth` đến từ **testcontainers**:
    # mỗi spec file tự dựng một container `postgres:17-alpine`, provision hai role
    # đúng runbook `deploys/auth-db/migrations/README.md` (migrator có DDL, runtime chỉ
    # DML) và apply migration bằng credential migrator thật. Không có service
    # container hay biến `AUTH_TEST_PG_*` nào ở đây — runner chỉ cần có Docker.
    # Password trong harness là của database nhúng ném đi sau mỗi run, không phải
    # credential của môi trường thật; các migration không đọc secret nào.
    steps:
      - name: Start runner resource monitoring
        continue-on-error: true
        uses: Garbee/runner-resource-usage@5d478275bca9b56badaca884f6e3858085e2ca18 # main HEAD (upstream chưa có tag)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Cấp Chromium + thư viện hệ thống qua input `with-playwright` của setup
      # action: đúng một lượt ở **cấp job**, trước khi Nx chạy, và chạy đồng
      # thời với `pnpm install` (hai luồng không dùng chung path hay lock nào —
      # pnpm ghi store + node_modules, playwright tải browser vào
      # `~/.cache/ms-playwright` và tự chạy apt-get). Giữ đúng ràng buộc issue
      # #253: không còn bước cấp browser nào trong Nx task graph, nên
      # `apps/backoffice/tests/browser/ensure-playwright-browser.sh` là cache
      # hit, không `apt-get` nào trong task graph; `pact-broker-app` không còn
      # script riêng — thiếu browser ở đó đỏ ngay tại `chromium.launch()` của
      # suite.
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          with-playwright: true
      # Tách lane browser khỏi phần còn lại của `test-integration` (issue #253).
      # Trên affected set rộng (27 project, `--parallel=6`), Chromium huỷ cả loạt
      # request module của Vite dev server trong một đợt với
      # `net::ERR_NETWORK_CHANGED`, kèm `Failed to fetch dynamically imported
      # module: .../nuxt/dist/app/entry.js`; client Nuxt không bao giờ mount
      # (`ssr: false` nên shell rỗng phía server là đúng hành vi). Cùng HEAD trên
      # affected set hẹp thì xanh, nên lỗi gắn với quy mô job chứ không với mã
      # nguồn. Sự kiện thay đổi network topology của runner trùng với các
      # project dùng Docker/testcontainers chạy song song trong job. Lưu ý cơ
      # chế CHƯA được kết luận nhân quả: cả hai project browser lane (backoffice,
      # pact-broker-app) serve production build qua workerd, nhưng dev server
      # Vite/Nuxt chỉ có ở backoffice — tương quan task-changed là Docker
      # parallelism, tác nhân cụ thể chưa được đo.
      #
      # Vì vậy hai bước dưới đây chạy tuần tự trong cùng job: bước đầu chạy phần
      # không dùng browser; bước sau chạy riêng hai project dùng Playwright với
      # `threads: 1`, để không task Docker nào của bước đầu còn chạy khi browser
      # khởi động. Bước hai chọn đúng hai project bằng `--exclude` dạng phủ định
      # (`*,!project`); affected set không chứa chúng thì Nx báo "0 tasks" và
      # thoát 0, không phải lỗi.
      - name: Integration test
        uses: ./.github/actions/run-nx-target
        with:
          targets: test-integration
          threads: '1'
          affected: ${{ !inputs.force && github.event_name != 'schedule' }}
          bail: ${{ github.event_name == 'merge_group' }}

  # Bộ system test (Playwright + Chromium thật) chạy trên local platform stack
  # thật: invocation `nx affected -t system-test -c local` là ĐƯỜNG DUY NHẤT dẫn
  # stack vào job — qua `dependsOn` target `system-test` của từng suite trỏ tới
  # `local-up` của deploy project nó cần, Nx tự schedule deploy prerequisite
  # trước suite (task `local-up` chạy `pulumi up` thật, tự sinh passphrase Pulumi
  # + mật khẩu PostgreSQL, KHÔNG secret production nào được inject, và task
  # platform ghi `.env` với ROOT_HOST mà các suite đọc). Suite
  # fail-closed khi stack không có (gate trong `global-setup.ts`), nên không
  # deploy là đỏ: chạy thật là điều kiện của job này, không phải cải tiến. Không
  # còn bước deploy hardcoded nào đứng trước invocation — trong đó PR docs-only
  # được "không deploy" một cách tự nhiên: affected không chọn suite nào thì
  # task graph rỗng, không `pulumi up` nào chạy.
  #
  # Job KHÔNG có `if:` nào — và đó là điều kiện đúng đắn của nó. `ci-gate` fail với
  # mọi kết quả khác `success`, kể cả `skipped`, nên một job bị bỏ qua ở đây sẽ làm
  # đỏ cả pipeline. Trên PR chỉ chạm tài liệu, `nx affected -t system-test` không có
  # project nào bị ảnh hưởng và thoát 0 với "0 tasks" (các target `system-test` đều
  # `cache: false`, nhưng affected = 0 task thì không tốn phút test — lẫn phút
  # deploy — nào).
  system-test:
    name: system-test
    runs-on: ubuntu-26.04
    # Deploy lane các deploy unit build image khi cache Docker của runner lạnh;
    # tests bổ sung gate retry + chromium thật. 60 phút là trần đo từ budget
    # deploy + các suite chạy tuần tự (mỗi suite ~1 phút đo thực tế), không phải
    # mục tiêu: job xanh điển hình kết thúc sớm hơn nhiều, và PR docs-only
    # kết thúc gần như ngay lập tức (0 task).
    timeout-minutes: 60
    steps:
      - name: Start runner resource monitoring
        continue-on-error: true
        uses: Garbee/runner-resource-usage@5d478275bca9b56badaca884f6e3858085e2ca18 # main HEAD (upstream chưa có tag)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Cấp Chromium + thư viện hệ thống qua input `with-playwright` của setup
      # action (`@playwright/test` không có postinstall tải browser): chạy đồng
      # thời với `pnpm install`, đúng một lượt trước khi Nx khởi động.
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          with-playwright: true
      # Deploy không còn là step riêng: nó nằm TRONG invocation bên dưới qua task
      # graph (mỗi target `system-test` khai `dependsOn` → `local-up` của deploy
      # project nó cần, configuration `local` chọn đúng lane), nên một invocation
      # chạy trọn vẹn deploy + test. System-test KHÔNG retry: mã nguồn phải đáng
      # tin cậy, retry chỉ che giấu flake thật và làm chậm phản hồi CI khi đỏ.
      # Nếu race/deploy lock xuất hiện, phải sửa ở nguồn (container init, stack
      # lock mồ côi) thay vì che bằng retry. `retries` giữ mặc định 1 (không
      # retry) của action; `retry-command` không truyền.
      # `threads: '1'`: các suite chia sẻ MỘT stack trên runner (grants, mail
      # sink D1, OTP rate-limit, Traefik) — chạy song song tái tạo đúng xung đột
      # chéo suite mà per-file identities đã xử lý trong phạm vi một suite, nên
      # thực thi tuần tự theo quyết định của user.
      - name: System tests
        uses: ./.github/actions/run-nx-target
        with:
          targets: system-test
          affected: ${{ !inputs.force && github.event_name != 'schedule' }}
          bail: ${{ github.event_name == 'merge_group' }}
          threads: '1'
          configuration: local
      # Chỉ khi đỏ: trace, screenshot và HTML report là bằng chứng duy nhất còn lại
      # sau khi runner bị xoá, và không có chúng thì một job đỏ ở CI là thứ người
      # khác không tái hiện được. Đường dẫn theo BỐN suite system-test
      # (`system-tests/e2e/<suite>/`) — mỗi suite tự giữ `playwright-report/` +
      # `test-results/` ngay trong project của nó.
      - name: Upload Playwright artifacts
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-test-playwright-artifacts
          path: system-tests/e2e
          if-no-files-found: ignore
          retention-days: 7

  ci-gate:
    name: ci-gate
    needs: [verify, integration-test, system-test]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/aggregate-gate
        with:
          results: ${{ join(needs.*.result, ' ') }}
          gate-name: 'ci-gate'
