name: Project Management

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'audit is read-only and reports drift; apply mutates membership (minted app token needs org project write)'
        type: choice
        required: false
        default: audit
        options:
          - audit
          - apply
      reason:
        description: 'Reason for the manual run, echoed into the run log'
        type: string
        required: false
        default: ''
  schedule:
    # Audit hằng ngày 05:30 UTC. Schedule PHẢI là audit: apply chỉ được phép
    # qua workflow_dispatch có người chịu trách nhiệm.
    - cron: '30 5 * * *'
  # Membership policy suy từ issue (root/sub, title prefix exclusion), nên sự
  # kiện vòng đời issue có thể đổi desired membership. GitHub Actions không có
  # trigger native cho `sub_issues` hay `projects_v2_item` — hai loại đó chờ
  # audit hằng ngày (04-platform-facts §2.20).
  issues:
    types: [opened, edited, deleted, transferred]

# Mode cho run kích hoạt bởi sự kiện issue; lật sang `apply` là đổi đúng giá
# trị này (sau khi quan sát đủ kỳ run audit từ sự kiện thật).
env:
  EVENT_RECONCILE_MODE: audit

permissions:
  contents: read
  issues: read

concurrency:
  group: project-management
  cancel-in-progress: false

jobs:
  reconcile:
    name: reconcile
    # Chỉ sự kiện membership-relevant mới chạy: opened/deleted/transferred,
    # hoặc edited đổi title (exclusion prefix phụ thuộc title). Edit body
    # không đổi membership. Burst sự kiện collapse về 1 pending nhờ
    # concurrency group (cancel-in-progress: false).
    if: >-
      github.event_name != 'issues' ||
      contains(fromJSON('["opened", "deleted", "transferred"]'), github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.title != null)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
      # Project #13 là org project: GITHUB_TOKEN của repo không thao tác được,
      # nên mint installation token từ GitHub App của org. Permission xin theo
      # chế độ chạy (audit → organization-projects: read, apply → write) để
      # token hôm schedule không mang quyền write. App phải được org admin cấp
      # Organization projects + Issues read; thiếu quyền thì bước mint fail
      # kèm lỗi rõ ràng của action.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ECOMA_APP_ID }}
          private-key: ${{ secrets.ECOMA_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-issues: read
          # Xin quyền theo mode đã resolve, fail-closed về read cho mọi giá
          # trị không tường minh là apply.
          permission-organization-projects: >-
            ${{ ((github.event_name == 'workflow_dispatch' && inputs.mode == 'apply') ||
            (github.event_name == 'issues' && env.EVENT_RECONCILE_MODE == 'apply')) && 'write' || 'read' }}
      # Business logic nằm trong tools/project-management; step này chỉ invocation.
      - name: Reconcile project membership
        env:
          # Installation token của App (mint ở step trên); PAT classic scope
          # `project` vẫn dùng được cho chạy CLI local.
          PROJECT_MANAGEMENT_TOKEN: ${{ steps.app-token.outputs.token }}
          # Schedule bao giờ cũng audit; sự kiện issue lấy mode từ
          # EVENT_RECONCILE_MODE; dispatch lấy từ input.
          RECONCILE_MODE: ${{ github.event_name == 'schedule' && 'audit' || github.event_name == 'issues' && env.EVENT_RECONCILE_MODE || inputs.mode || 'audit' }}
          # Biểu thức phải nằm trong block scalar (>--) để khoảng trắng trước
          # `#{1}` không bị YAML đọc thành điểm bắt đầu comment và cắt cụt
          # chuỗi giữa biểu thức ${{ }}.
          RECONCILE_REASON: >-
            ${{ github.event_name == 'issues' && format('issues.{0} #{1}', github.event.action, github.event.issue.number) || inputs.reason }}
        run: |
          if [ -n "$RECONCILE_REASON" ]; then
            echo "Dispatch reason: $RECONCILE_REASON"
          fi
          if [ "$RECONCILE_MODE" = "apply" ] && [ -z "$PROJECT_MANAGEMENT_TOKEN" ]; then
            echo "::error::apply mode requires an app token with org project read/write permission."
            exit 1
          fi
          npx tsx tools/project-management/index.ts reconcile \
            --mode "$RECONCILE_MODE" \
            --owner ecoma-io \
            --repo ecoma-io/ecoma \
            --project 13 \
            --policy tools/project-management/config/membership-policy.json \
            --out tools/project-management/test-output/report.json
      # Report là bằng chứng duy nhất còn lại sau khi runner bị xoá; upload cả
      # khi reconcile đỏ (status failed vẫn có report JSON).
      - name: Upload reconciliation report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-management-report
          path: tools/project-management/test-output/report.json
          if-no-files-found: ignore
          retention-days: 7
