name: Staging deploy (coordinator)

# Coordinator staging của issue #362 (slice B; hợp đồng `02-delivery.md` §7.2,
# §7.4, §7.5): MỘT workflow tự chủ (không gọi reusable lane) chạy WHOLE-batch —
#
# 1. `context` — chọn SHA được phép deploy (workflow_run sau CI xanh trên main,
#    SHA từ `workflow_run.head_sha` qua env, KHÔNG BAO GIỜ `github.sha`; §7.2)
#    + guard tổ tiên của main. Mirror `staging-home.yaml`.
# 2. `plan` — NƠI DUY NHẤT sinh matrix deploy: CLI `staging-plan` audit toàn
#    workspace (eligibility mọi project, drift release.projects, §7.5 mục 2/17)
#    rồi map affected → batch units + migration steps (§7.5 mục 1/16); sau đó
#    guard `coalesce` lúc admission (§7.2 điều 3, §7.4): có run mới hơn của
#    cùng workflow là nhường — skip. Abort-main-advanced ở admission GHI failure
#    status cho batch (revision cố ý bị ghi lại là off-edge).
# 3. `migrate` — fail-closed CÓ TÊN: khi plan tính ra migration steps mà hợp
#    đồng credential của migrator staging chưa được wire, job đỏ với thông
#    điệp nêu đúng cái còn thiếu — không deploy schema chưa migrate, không tự
#    bịa contract.
# 4. `build` (matrix per unit) — cổng per-unit `staging-unit-gate` (§7.4.3,
#    deny in reason machine-readable) chạy TRƯỚC nx build: leg đỏ trước cổng
#    Environment, chưa dùng credential nào. Build + manifest + artifact như
#    reusable lane.
# 5. `deploy` (matrix per unit) — Environment `staging-<slug>` (§6.12), CLI
#    `staging-deploy` + `staging-smoke` với guard `before-deploy` /
#    `before-status` (§7.4): marker machine-readable `staging-guard action=…`
#    điều khiển việc ghi commit status `release/staging-verified/<slug>` —
#    skip = KHÔNG ghi gì (nhường evidence run mới hơn); abort-query-failed =
#    đỏ KHÔNG đụng evidence; abort-main-advanced = đỏ VÀ ghi failure.
# 6. `summary` — always(): batch rỗng là no-op HỢP LỆ được báo rõ (§7.5 mục 2),
#    không bao giờ im lặng xanh.
#
# Khác biệt có chủ đích với `staging-home.yaml`: caller đó vẫn hoạt động song
# song cho unit home cho tới khi coordinator được bật làm lane duy nhất —
# overlap này được khai báo trong PR của slice, không phải quên dọn.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Commit status `release/staging-verified/<slug>` + guard truy vấn run qua
# `gh api` (actions:read) — đúng quyền cần, không cấp gì khác.
permissions:
  contents: read
  statuses: write
  actions: read

# Hàng đợi không-cancel của TOÀN coordinator (§7.4): persistent staging, hai
# run xếp hàng tuần tự; coalescing do guard `coalesce` quyết, không phải cancel.
concurrency:
  group: staging-coordinator
  cancel-in-progress: false

jobs:
  context:
    name: Resolve and guard the deploy SHA
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      deploy_sha: ${{ steps.guard.outputs.deploy_sha }}
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      # Checkout REF TIN CẬY (default branch) trong ngữ cảnh workflow_run —
      # guard chạy code của main, không bao giờ code của head ref sự kiện.
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Guard the deploy SHA
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Fail-safe: mặc định skip — mọi đường không qua đủ guard đều không
          # deploy; ghi TRƯỚC rồi ghi đè ở cuối khi mọi guard đã pass.
          echo "deploy_sha=" >> "$GITHUB_OUTPUT"
          echo "skip=true" >> "$GITHUB_OUTPUT"

          case "$EVENT_NAME" in
            workflow_run)
              if [ "$WR_CONCLUSION" != "success" ]; then
                echo "skip: the CI run concluded \"$WR_CONCLUSION\" — the lane deploys a green main only"
                exit 0
              fi
              if [ "$WR_HEAD_BRANCH" != "$DEFAULT_BRANCH" ]; then
                echo "skip: CI ran on \"$WR_HEAD_BRANCH\" — the lane tracks \"$DEFAULT_BRANCH\" only"
                exit 0
              fi
              sha="$WR_HEAD_SHA"
              ;;
            workflow_dispatch)
              if [ "$DISPATCH_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
                echo "skip: dispatch ref \"$DISPATCH_REF\" — the lane deploys \"$DEFAULT_BRANCH\" only (§7.2: PR builds never deploy)"
                exit 0
              fi
              sha="$(git rev-parse HEAD)"
              ;;
            *)
              echo "::error::unsupported trigger event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::deploy SHA is not a full 40-hex commit SHA: \"$sha\" (§7.3: the lane records evidence against the exact SHA only)" >&2
            exit 1
          fi
          # SHA phải là tổ tiên của main hiện tại — không deploy một revision
          # đã rơi khỏi main (force-push, branch xoá).
          git merge-base --is-ancestor "$sha" "origin/$DEFAULT_BRANCH"

          echo "deploy_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

  plan:
    name: Audit the workspace and plan the batch
    needs: context
    if: needs.context.outputs.skip != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      has_units: ${{ steps.plan.outputs.has_units }}
      units_matrix: ${{ steps.plan.outputs.units_matrix }}
      migrations: ${{ steps.plan.outputs.migrations }}
      slugs: ${{ steps.plan.outputs.slugs }}
      coalesce_action: ${{ steps.coalesce.outputs.guard_action }}
    steps:
      - name: Start runner resource monitoring
        uses: Garbee/runner-resource-usage@5d478275bca9b56badaca884f6e3858085e2ca18 # main HEAD (upstream chưa có tag)
      # Checkout SHA ĐÃ QUÁ GUARD của context; fetch-depth 0 để đọc parent
      # (base của `nx affected` là parent của SHA deploy).
      - name: Check out the verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.deploy_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
      # Bước 1: audit + mapping. Lỗi audit (unclassified, drift, file hỏng) là
      # job đỏ TRƯỚC guard và TRƯỚC cổng Environment (§7.5 mục 17: lỗi audit
      # không bao giờ biến thành no-op xanh).
      - name: Plan the deploy batch
        id: plan
        env:
          DEPLOY_SHA: ${{ needs.context.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          base="$(git rev-parse "$DEPLOY_SHA"^)"
          plan_json="$(npx tsx tools/delivery/src/cli.ts staging-plan --sha "$DEPLOY_SHA" --base "$base")"
          printf '%s\n' "$plan_json"
          units="$(printf '%s\n' "$plan_json" | jq -c '{include: [.units[] | {project, slug, config_path: .configPath, environment}]}')"
          migrations="$(printf '%s\n' "$plan_json" | jq -c '[.migrations[].dbProject]')"
          slugs="$(printf '%s\n' "$plan_json" | jq -r '[.units[].slug] | join(" ")')"
          count="$(printf '%s\n' "$plan_json" | jq '.units | length')"
          echo "units_matrix=$units" >> "$GITHUB_OUTPUT"
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then echo "has_units=false" >> "$GITHUB_OUTPUT";
          else echo "has_units=true" >> "$GITHUB_OUTPUT"; fi
      # Bước 2: guard `coalesce` lúc admission (§7.4). Bật qua GITHUB_RUN_ID +
      # SHA run; CLI tự tra cứu run MỚI bằng gh api. skip = exit 0, các job sau
      # đọc has_units… vẫn chạy? KHÔNG — summary đọc coalesce_action và báo
      # "coalesced"; build/deploy không có leg nào được bật (xem `if` của chúng).
      - name: Coalesce at admission
        id: coalesce
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.context.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          out="$(npx tsx tools/delivery/src/cli.ts staging-guard \
            --point coalesce --run-id "$GITHUB_RUN_ID" --head-sha "$DEPLOY_SHA")"
          printf '%s\n' "$out"
          # Marker là dòng stdout CUỐI theo hợp đồng `staging-guard.ts`.
          action="$(printf '%s\n' "$out" | sed -n 's/^staging-guard action=//p' | tail -n 1)"
          if [ -z "$action" ]; then action=unknown; fi
          echo "guard_action=$action" >> "$GITHUB_OUTPUT"
      # Abort-main-advanced ở admission: revision NÀY cố ý bị ghi lại là
      # off-edge — ghi failure status cho TẤT CẢ slug của batch (§7.4). Có thể
      # tính slug vì bước plan đã chạy TRƯỚC guard.
      - name: Record off-edge failure statuses (main advanced)
        if: failure() && steps.coalesce.outputs.guard_action == 'abort-main-advanced' && steps.plan.outputs.slugs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.context.outputs.deploy_sha }}
          SLUGS: ${{ steps.plan.outputs.slugs }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for slug in $SLUGS; do
            gh api "repos/$REPO/statuses/$SHA" \
              -f state=failure \
              -f context="release/staging-verified/$slug" \
              -f description="coalesced off-edge — main advanced past this revision" \
              -f target_url="$RUN_URL" > /dev/null
          done

  migrate:
    name: Fail closed on unmigrated schema
    needs: [context, plan]
    if: needs.context.outputs.skip != 'true' && needs.plan.outputs.has_units == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check the migration contract
        env:
          MIGRATIONS: ${{ needs.plan.outputs.migrations }}
        run: |
          set -euo pipefail
          count="$(printf '%s' "$MIGRATIONS" | jq 'length')"
          if [ "$count" -gt 0 ]; then
            echo "::error::$count migration step(s) planned for this batch ($MIGRATIONS) but the staging migrator credential contract is not wired yet — the coordinator refuses to deploy a batch whose schema has not migrated (fail closed). Wire the db-migrate job (DATABASE_URL for deploys/*-db, 02-delivery.md §3a) before enabling batch deploys with database changes." >&2
            exit 1
          fi
          echo "no migration steps in this batch — deploy may proceed"

  build:
    name: Gate and build ${{ matrix.project }}
    needs: [context, plan, migrate]
    if: needs.context.outputs.skip != 'true' && needs.plan.outputs.has_units == 'true' && needs.plan.outputs.coalesce_action == 'proceed'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      # MỌI leg đỏ cùng lúc là đúng: audit lỗi của MỘT unit là lỗi của batch.
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.units_matrix) }}
    steps:
      - name: Start runner resource monitoring
        uses: Garbee/runner-resource-usage@5d478275bca9b56badaca884f6e3858085e2ca18 # main HEAD (upstream chưa có tag)
      - name: Check out the verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.deploy_sha }}
          persist-credentials: false
      # KHÔNG pnpm cache-save ở job có checkout do matrix chỉ định — cùng lý
      # do cache-poisoning với reusable lane.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Cổng per-unit (§7.4.3): deny in reason machine-readable rồi exit 1 —
      # leg đỏ TRƯỚC nx build, chưa chạm Environment hay credential nào.
      - name: Run the staging unit gate
        env:
          PROJECT: ${{ matrix.project }}
          CONFIG_PATH: ${{ matrix.config_path }}
          DEPLOY_SHA: ${{ needs.context.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          npx tsx tools/delivery/src/cli.ts staging-unit-gate \
            --project "$PROJECT" --config "$CONFIG_PATH" --ref-sha "$DEPLOY_SHA"
      - name: Locate the project root
        id: locate
        env:
          CONFIG_PATH: ${{ matrix.config_path }}
        run: |
          set -euo pipefail
          echo "project-root=${CONFIG_PATH%/*}" >> "$GITHUB_OUTPUT"
      - name: Build the deploy unit
        env:
          NX_PROJECT: ${{ matrix.project }}
        run: pnpm exec nx run "$NX_PROJECT":build
      - name: Write the build manifest
        env:
          CONFIG_PATH: ${{ matrix.config_path }}
          DEPLOY_SHA: ${{ needs.context.outputs.deploy_sha }}
          PROJECT_ROOT: ${{ steps.locate.outputs.project-root }}
        run: |
          set -euo pipefail
          npx tsx tools/delivery/src/cli.ts staging-manifest \
            --config "$CONFIG_PATH" --sha "$DEPLOY_SHA" \
            > "$PROJECT_ROOT/build-manifest.json"
          cat "$PROJECT_ROOT/build-manifest.json"
      - name: Upload the build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-deploy-${{ matrix.slug }}
          path: |
            ${{ steps.locate.outputs.project-root }}/.output
            ${{ matrix.config_path }}
            ${{ steps.locate.outputs.project-root }}/build-manifest.json
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy and smoke ${{ matrix.slug }}
    needs: [context, plan, build]
    if: needs.context.outputs.skip != 'true' && needs.plan.outputs.has_units == 'true' && needs.plan.outputs.coalesce_action == 'proceed'
    runs-on: ubuntu-26.04
    # Trần job VƯỢT worst case lớp retry §7.4 (3 lần × 4 phút + backoff + smoke
    # budget + install) — một job chết vì timeout tự nó là đỏ đúng.
    timeout-minutes: 25
    # Environment là cổng duy nhất nạp secret Cloudflare của unit (§6.12).
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      statuses: write
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.units_matrix) }}
    steps:
      - name: Start runner resource monitoring
        uses: Garbee/runner-resource-usage@5d478275bca9b56badaca884f6e3858085e2ca18 # main HEAD (upstream chưa có tag)
      - name: Check out the verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.deploy_sha }}
          persist-credentials: false
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Locate the project root
        id: locate
        env:
          CONFIG_PATH: ${{ matrix.config_path }}
        run: |
          set -euo pipefail
          echo "project-root=${CONFIG_PATH%/*}" >> "$GITHUB_OUTPUT"
      - name: Download the build artifact of this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: staging-deploy-${{ matrix.slug }}
          path: ${{ steps.locate.outputs.project-root }}
      - name: Deploy the staging worker
        id: deploy
        env:
          # Secret tổ duy nhất (§6.12) — CLI đưa vào subprocess wrangler dưới
          # tên CLOUDFLARE_API_TOKEN, KHÔNG BAO GIỜ qua argv hay log.
          ECOMA_CLOUDFLARE_API_TOKEN: ${{ secrets.ECOMA_CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          CONFIG_PATH: ${{ matrix.config_path }}
          PROJECT: ${{ matrix.project }}
          SLUG: ${{ matrix.slug }}
          DEPLOY_SHA: ${{ needs.context.outputs.deploy_sha }}
          PROJECT_ROOT: ${{ steps.locate.outputs.project-root }}
        run: |
          set -euo pipefail
          out="$(npx tsx tools/delivery/src/cli.ts staging-deploy \
            --config "$CONFIG_PATH" --project "$PROJECT" --slug "$SLUG" \
            --manifest "$PROJECT_ROOT/build-manifest.json" --expect-sha "$DEPLOY_SHA" \
            --guard-run-id "$GITHUB_RUN_ID" --guard-head-sha "$DEPLOY_SHA")"
          printf '%s\n' "$out"
          action="$(printf '%s\n' "$out" | sed -n 's/^staging-guard action=//p' | tail -n 1)"
          if [ -z "$action" ]; then action=unknown; fi
          echo "guard_action=$action" >> "$GITHUB_OUTPUT"
      # Chỉ smoke khi deploy THẬT SỰ chạy — guard skip ở deploy là nhường run
      # mới hơn, smoke một origin của revision cũ chỉ tạo retry noise.
      - name: Smoke the staging origin
        id: smoke
        if: steps.deploy.outputs.guard_action == 'proceed'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ matrix.slug }}
          DEPLOY_SHA: ${{ needs.context.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          # Hợp đồng smoke per unit là BẢN ĐỒ TƯỜNG MINH slug → cờ kiểm, khai
          # theo khả năng của app (§7.5 mục 9); slug lạ là fail-closed — thêm
          # nó vào bản đồ này khi unit mới vào batch, KHÔNG đoán.
          case "$SLUG" in
            home)
              origin='https://ecoma.io.vn'
              args='--redirect /=/en --health /health --noindex /en'
              ;;
            auth-nonce-prune-job)
              # Cron job không có bề mặt HTTP — smoke không áp dụng (bỏ theo
              # hợp đồng, không phải bỏ vì app hỏng).
              echo "smoke: unit \"$SLUG\" has no HTTP surface — skipped by contract"
              echo "guard_action=proceed" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::error::no staging smoke contract for slug \"$SLUG\" — add it to the smoke map in staging.yaml (fail closed)" >&2
              exit 1
              ;;
          esac
          # shellcheck disable=SC2086 — word-split là hợp đồng của bản đồ này.
          out="$(npx tsx tools/delivery/src/cli.ts staging-smoke "$origin" $args \
            --guard-run-id "$GITHUB_RUN_ID" --guard-head-sha "$DEPLOY_SHA")"
          printf '%s\n' "$out"
          action="$(printf '%s\n' "$out" | sed -n 's/^staging-guard action=//p' | tail -n 1)"
          if [ -z "$action" ]; then action=unknown; fi
          echo "guard_action=$action" >> "$GITHUB_OUTPUT"
      # Hợp đồng marker quyết định việc ghi status (§7.4): success CHỈ khi cả
      # hai guard đều proceed; skip/abort-query-failed KHÔNG đụng evidence;
      # abort-main-advanced (và mọi đỏ thật) ghi failure.
      - name: Record the staging-verified status (success)
        if: >-
          success() &&
          steps.deploy.outputs.guard_action == 'proceed' &&
          (steps.smoke.outputs.guard_action == 'proceed' || steps.smoke.outcome == 'skipped')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.context.outputs.deploy_sha }}
          SLUG: ${{ matrix.slug }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/statuses/$SHA" \
            -f state=success \
            -f context="release/staging-verified/$SLUG" \
            -f description="deploy + staging smoke passed" \
            -f target_url="$RUN_URL" > /dev/null
      - name: Record the staging-verified status (failure)
        if: >-
          failure() &&
          steps.deploy.outputs.guard_action != 'abort-query-failed' &&
          steps.smoke.outputs.guard_action != 'abort-query-failed'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.context.outputs.deploy_sha }}
          SLUG: ${{ matrix.slug }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/statuses/$SHA" \
            -f state=failure \
            -f context="release/staging-verified/$SLUG" \
            -f description="deploy or staging smoke failed" \
            -f target_url="$RUN_URL" > /dev/null
      # Cancel (tay, runner mất, timeout hàng đợi) là KHÔNG verified — mirror
      # reusable lane; guard !failure() giữ nguyên kết quả thật đã ghi.
      - name: Record the staging-verified status (cancelled)
        if: cancelled() && !failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.context.outputs.deploy_sha }}
          SLUG: ${{ matrix.slug }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/statuses/$SHA" \
            -f state=error \
            -f context="release/staging-verified/$SLUG" \
            -f description="deploy or staging smoke cancelled" \
            -f target_url="$RUN_URL" > /dev/null

  summary:
    name: Report the batch outcome
    needs: [context, plan, migrate, build, deploy]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Summarise the run
        env:
          SKIP: ${{ needs.context.outputs.skip }}
          PLAN_RESULT: ${{ needs.plan.result }}
          HAS_UNITS: ${{ needs.plan.outputs.has_units }}
          COALESCE: ${{ needs.plan.outputs.coalesce_action }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          MIGRATE_RESULT: ${{ needs.migrate.result }}
          SLUGS: ${{ needs.plan.outputs.slugs }}
        run: |
          set -euo pipefail
          if [ "$SKIP" = "true" ]; then
            echo "summary: event did not pass the context guard — nothing to deploy"
            exit 0
          fi
          # Lỗi audit/mapping/guard-admission KHÔNG BAO GIỜ thành no-op xanh
          # (§7.5 mục 17): đỏ đúng ở đây là hợp đồng.
          if [ "$PLAN_RESULT" != "success" ] && [ "$PLAN_RESULT" != "skipped" ]; then
            echo "::error::plan failed — workspace audit, mapping or admission guard rejected the batch; see the plan job"
            exit 1
          fi
          if [ "$COALESCE" != "proceed" ] && [ "$COALESCE" != "" ]; then
            echo "summary: coalesced at admission (guard action: $COALESCE) — a newer run serves the revision"
            exit 0
          fi
          if [ "$HAS_UNITS" != "true" ]; then
            # Batch rỗng là no-op HỢP LỆ (§7.5 mục 2) — báo rõ, không im lặng xanh.
            echo "summary: no staging-affected releaseable unit in this revision — valid empty batch"
            exit 0
          fi
          echo "summary: batch [$SLUGS] — migrate: $MIGRATE_RESULT, build: $BUILD_RESULT, deploy: $DEPLOY_RESULT"
          if [ "$BUILD_RESULT" != "success" ] || [ "$DEPLOY_RESULT" != "success" ] || [ "$MIGRATE_RESULT" != "success" ]; then
            echo "::error::batch did not complete cleanly — see the matrix jobs above"
            exit 1
          fi
          echo "summary: batch deployed and verified"
