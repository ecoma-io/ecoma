name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly full-workspace run, and the same on demand. Every other trigger
  # judges a selection: a PR runs `nx affected`, which is only ever as complete
  # as the dependency edges the graph can see — an implicit edge nobody declared
  # (a glob reaching into another project, a file read off disk) makes a real
  # break invisible to the PR that caused it. This run has no selection and no
  # warm cache to shortcut, so it is where that class of miss surfaces, on main,
  # once a day rather than at the next unlucky PR.
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

# Every job here only reads the repository and runs local checks — none call
# the GitHub API or write anything back — so contents: read is the ceiling.
permissions:
  contents: read

# A new push to a PR supersedes the in-flight run for it. A push to main gets a
# group of its own per commit — grouping main by ref instead would let a newer
# commit cancel an older one that is still queued (cancel-in-progress only
# spares runs that have already started), leaving that commit with no result in
# main's history.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_DAEMON: "false"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Checkout cannot move into ./.github/actions/setup with the rest of the
      # prelude: a local action is resolved from the workspace, which is empty
      # until the repository is on disk. Full history (fetch-depth: 0) because
      # both `nx affected` and `commitlint --from origin/<base>` diff against
      # history, not just the tip commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # Rebase-merge lands every branch commit on main verbatim, and the local
      # commit-msg hook cannot see amended/rebased history — so both message
      # gates re-run here per PR commit (merge commits are ignored, matching
      # commitlint's own defaults).
      - name: Commit messages (Conventional + scope ↔ path)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pnpm commitlint --from "origin/$BASE_REF" --to HEAD
          for sha in $(git rev-list --no-merges "origin/$BASE_REF..HEAD"); do
            node shared/tools/dev-cli/src/main.mjs check-commit-scope --commit "$sha"
          done

      # The CLA grants nothing until the contributor's record exists, and only
      # CI knows who opened the pull request. `user.type` travels with it because
      # a machine account cannot hold a copyright to license, and GitHub is the
      # only authority on which accounts are machines — the gate must not infer
      # that from a `[bot]` suffix. Bare mode also runs on every push, so a
      # malformed record is caught wherever it lands.
      - name: Contributor record (CLA acceptance)
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          if [ -n "$PR_AUTHOR" ]; then
            node shared/tools/dev-cli/src/main.mjs check-contributor-record \
              --author "$PR_AUTHOR" --author-type "$PR_AUTHOR_TYPE"
          else
            node shared/tools/dev-cli/src/main.mjs check-contributor-record
          fi

      # Roadmap rule #6: a gate is a frozen text plus an independent suite.
      # Reports the ledger every run and fails a freeze that has no suite.
      - name: Conformance gate ledger (roadmap rule #6)
        run: node shared/tools/dev-cli/src/main.mjs conformance

      # Repo-wide doc gates that `nx affected` can't cover: journey markers
      # (Rule 13) in files no nx project owns (root docs, the subsystem-root
      # CLAUDE.md files, .github, .claude), and broken relative Markdown links.
      - name: Journey markers in workspace-level docs
        run: node shared/tools/dev-cli/src/main.mjs check-journey-markers-workspace
      - name: Broken Markdown links
        run: node shared/tools/dev-cli/src/main.mjs check-doc-links
      - name: dev-cli command citations still name a real command
        run: node shared/tools/dev-cli/src/main.mjs check-command-refs
      - name: Per-subproject CLAUDE.md present
        run: node shared/tools/dev-cli/src/main.mjs check-claude-md
      - name: Published doctrine stays checkable by a stranger
        run: node shared/tools/dev-cli/src/main.mjs check-doctrine
      - name: Roadmap ids stay unique and resolvable
        run: node shared/tools/dev-cli/src/main.mjs check-roadmap-ids
      - name: Doctrine index cites live rules
        run: node shared/tools/dev-cli/src/main.mjs check-practice-index
      - name: Subsystem-root READMEs declare their area
        run: node shared/tools/dev-cli/src/main.mjs check-subsystem-readmes
      - name: Subproject READMEs present and structured
        run: node shared/tools/dev-cli/src/main.mjs check-subproject-readmes
      - name: Project structure conventions
        run: node shared/tools/dev-cli/src/main.mjs check-project-conventions

      # Polyglot toolchains. Go and Rust are UNCONDITIONAL: dev-cli's
      # scaffold-lib integration tests drive the real `go vet` and
      # `cargo check` on every run, whether or not any Go/Rust project
      # exists yet. golangci-lint and uv only matter once a real project
      # does, so they key off the workspace marker files. With the first
      # Rust crate, add Swatinem/rust-cache next to the toolchain step.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work # derives the version from go.work's own pin (CONTRIBUTING.md), never a second copy
          cache: false # no root go.sum yet; enable with the first Go project
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 → stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      # install-only: true — the Go lint target itself invokes golangci-lint
      # (project.json), so this step only needs the verified binary on PATH,
      # not a lint run of its own. The action downloads and checksums the
      # release itself, matching this file's other pinned-by-SHA installs.
      #
      # The version comes from .golangci-lint-version at the repo root
      # (Rule 14) — setup.mjs reads the same file, so the two can never drift
      # the way a restated literal would. A missing/empty file fails this step
      # loud rather than silently falling back to the action's own "latest".
      - name: Read the golangci-lint version pin
        if: hashFiles('go.work') != ''
        id: golangci-lint-version
        run: |
          test -s .golangci-lint-version || { echo "::error::.golangci-lint-version is missing or empty"; exit 1; }
          echo "version=$(cat .golangci-lint-version)" >> "$GITHUB_OUTPUT"
      - name: Install golangci-lint (Go lint targets run through it)
        if: hashFiles('go.work') != ''
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci-lint-version.outputs.version }}
          install-mode: binary
          install-only: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: hashFiles('pyproject.toml') != ''

      - name: Lint, test, typecheck, build
        uses: ./.github/actions/nx-run
        with:
          targets: lint test typecheck build

  # Separate from `checks` so the Playwright/Chromium download never blocks the
  # fast feedback loop, and so this job can grow a runner matrix without
  # dragging the doc gates and the Go/Rust toolchains along — nothing in the
  # `e2e` target set touches those.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # Cache the downloaded browser binaries only, never the OS packages
      # `--with-deps` installs — apt state isn't safely cacheable across
      # runs, so a cache hit still needs `install-deps` to satisfy Chromium's
      # shared-library requirements on a fresh runner. No restore-keys: a
      # partial match would restore browsers built for a different Playwright
      # version, and `install` would then be skipped on a stale hit.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: e2e
        uses: ./.github/actions/nx-run
        with:
          targets: e2e

  # The single fixed-name check for branch protection. A job named directly in
  # branch protection pins its own name: the moment `e2e` becomes a runner
  # matrix its checks are reported as `e2e (ubuntu-latest)` etc., so the
  # required check would have to be re-pointed on every leg added or removed.
  # Gating on this instead keeps one stable name across that change, and makes
  # a job that is never added to `needs` below impossible to leave ungated.
  ci-gate:
    runs-on: ubuntu-latest
    needs: [checks, e2e]
    # `always()`, not `!cancelled()`: a required check that ends *skipped*
    # counts as satisfied by branch protection, which is exactly the hole this
    # job exists to close. The price is a red gate on a cancelled run — a
    # superseded run, which nobody merges on anyway.
    if: always()
    steps:
      # Derived from `needs` rather than a second hand-written job list, so
      # adding a job above is one edit, not two that can drift (Rule 14).
      - name: Require every CI job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) ended \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            while IFS= read -r line; do echo "::error::$line, not success"; done <<< "$failed"
            exit 1
          fi
