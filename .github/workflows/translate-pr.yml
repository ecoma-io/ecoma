name: Pull request translation

on:
  # Not `pull_request`: a fork PR's token is read-only there, so the job could
  # never comment. `pull_request_target` runs against the BASE ref with a write
  # token, which is safe here for the same reason it is in pr-practice-review:
  # nothing from the PR head is ever checked out or executed -- the title and
  # body are read through the API and framed as untrusted data.
  pull_request_target:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      number:
        description: Pull request number to (re-)translate
        required: true

# A rapid title/body edit supersedes the previous translation -- only the
# newest text is worth spending free-tier calls on.
concurrency:
  group: translate-pr-${{ github.event.pull_request.number || inputs.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  translate:
    # Same boundary as translate-issue: a bot's pull request body is generated
    # text -- a dependency table and an upstream changelog -- and translating it
    # spends a detection quorum plus one call per language on output nobody
    # reads. `user.type` is GitHub's own answer, the same authority ci.yml asks
    # who needs a contributor record, rather than a `[bot]` suffix. A
    # `workflow_dispatch` run carries no pull request payload, so translating
    # one by hand still works.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No `ref:` here, deliberately. `pull_request_target` already checks out
      # the base branch, which IS the guarantee this job needs: it holds a write
      # token, so the only code it may run is the trusted base-branch copy of
      # repo-care, never anything the PR author controls.
      #
      # Naming that default explicitly (`ref: github.event.pull_request.base.sha`)
      # reads as the safer spelling but is strictly worse. Scorecard's
      # dangerous-workflow check flags any `ref` mentioning `github.event.pull_request`
      # under this trigger -- it cannot tell `.base.sha` from `.head.sha` -- so the
      # explicit form scored this repo as an untrusted checkout on Scorecard's
      # single heaviest check while changing nothing about what gets run. The
      # default is also marginally tighter: it tracks the base branch tip, i.e.
      # the newest trusted repo-care, rather than the sha recorded when the PR
      # was opened.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # repo-care is deliberately dependency-free (bare node, global fetch),
      # so no pnpm install.
      - name: Translate the pull request
        run: node shared/tools/repo-care/src/main.mjs translate-pr --pr "$NUMBER"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number || inputs.number }}
