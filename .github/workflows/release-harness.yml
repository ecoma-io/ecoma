# CD for the harness release group (nx.json > release.groups.harness) — and,
# for now, deliberately a REHEARSAL: every nx release invocation below carries
# --dry-run, so a run proves the whole pipeline resolves (version derivation
# from conventional commits, per-project changelog, tag pattern, publishable
# tarball) while writing nothing anywhere. That is exactly what can be proven
# today, because the two prerequisites of a real publish are operator acts no
# workflow can perform: the ecoma-io npm org must exist, and this workflow
# must be configured there as a trusted publisher (OIDC), so that no npm
# token ever lives in this repository.
#
# Flipping the rehearsal to the real thing is one deliberate edit, listed so
# it cannot be half-done: (1) drop every --dry-run below; (2) raise
# permissions to contents: write (nx release pushes the version commit and
# the {projectName}@{version} tag) plus id-token: write (npm provenance via
# trusted publishing); (3) confirm the trusted-publisher binding on npmjs.
# Until then the read-only token is the guarantee that a mis-click on the
# dispatch button cannot ship anything.
#
# workflow_dispatch is the release path — the harness group has its own
# cadence, cut when the operator decides a set of dev-cli changes is worth a
# version, not on every merge (delivery playbook §6, round 31: tooling rides
# its own train, outside one-tag-every-artifact). The pull_request trigger
# exists for one file only: this one. A workflow edit that breaks the release
# lane would otherwise be discovered at release time, the worst moment; a PR
# touching this file rehearses the lane it is editing. (It is also the only
# way a NEW workflow can prove itself on a runner at all — dispatch only
# resolves workflows already on the default branch.)
name: Release harness

on:
  workflow_dispatch:
    inputs:
      first-release:
        description: "No release tag exists yet for the group's projects (passes --first-release)"
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/workflows/release-harness.yml"

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nx release reads tags and walks conventional commits since the
          # last one — a shallow clone would misderive every version.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Version + changelog (dry-run)
        # On the rehearsal trigger (pull_request) there is no input to read;
        # while no group tag exists, --first-release is the only derivable
        # state, so the rehearsal assumes it.
        run: pnpm nx release --group=harness --skip-publish --dry-run ${{ (github.event_name == 'pull_request' || inputs.first-release) && '--first-release' || '' }}

      - name: Publish (dry-run)
        run: pnpm nx release publish --group=harness --dry-run
