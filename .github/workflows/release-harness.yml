# CD for the harness release group (nx.json > release.groups.harness), in its
# rehearsal configuration: every nx release invocation below carries --dry-run,
# so a run proves the whole pipeline resolves (version derivation from
# conventional commits, per-project changelog, tag pattern, publishable
# tarball) while writing nothing anywhere. The rehearsal configuration and the
# read-only token are one mechanism: together they make a dispatch that ships
# something structurally impossible, which is the correct behaviour of a
# release lane whose registry side does not exist — a real publish requires
# operator acts no workflow can perform (the ecoma-io npm org, and this
# workflow bound there as a trusted publisher over OIDC, so that no npm token
# ever lives in this repository).
#
# Converting the lane to a publishing one is one deliberate edit, listed so it
# cannot be half-done: (1) drop every --dry-run below; (2) raise permissions
# to contents: write (nx release pushes the version commit and the
# {projectName}@{version} tag) plus id-token: write (npm provenance via
# trusted publishing); (3) confirm the trusted-publisher binding on npmjs.
#
# workflow_dispatch is the release path — the harness group has its own
# cadence, cut when the operator decides a set of dev-cli changes is worth a
# version, not on every merge (delivery playbook §6: tooling rides
# its own train, outside one-tag-every-artifact). The pull_request trigger
# exists for one file only: this one. A workflow edit that breaks the release
# lane would otherwise be discovered at release time, the worst moment; a PR
# touching this file rehearses the lane it is editing. (It is also the only
# way a NEW workflow can prove itself on a runner at all — dispatch only
# resolves workflows already on the default branch.)
name: Release harness

on:
  workflow_dispatch:
    inputs:
      first-release:
        description: "No release tag exists yet for the group's projects (passes --first-release)"
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/workflows/release-harness.yml"

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nx release reads tags and walks conventional commits since the
          # last one — a shallow clone would misderive every version.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Version + changelog (dry-run)
        # On the rehearsal trigger (pull_request) there is no input to read;
        # while no group tag exists, --first-release is the only derivable
        # state, so the rehearsal assumes it.
        run: pnpm nx release --group=harness --skip-publish --dry-run ${{ (github.event_name == 'pull_request' || inputs.first-release) && '--first-release' || '' }}

      - name: Publish (dry-run)
        run: pnpm nx release publish --group=harness --dry-run
