name: Yêu cầu tính năng
description: Đề xuất capability mới hoặc thay đổi behavior hiện tại
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Viết issue bằng tiếng Việt; giữ nguyên file path, error code, technical term.
        Loại công việc và quy tắc Issue: `docs/engineering/work-management.md`.

  - type: dropdown
    id: work-kind
    attributes:
      label: Loại công việc
      description: |
        Bản chất thay đổi, khác với nhãn issue. Các lựa chọn xếp theo thứ tự ưu tiên ở
        `docs/engineering/evolution-process.md` §4.1: Remediation → Experiment → Modelling → Delivery → Discovery.
        Không chắc thì để trống và ghi lý do trong phần chi tiết.
      options:
        - Remediation — đóng một deviation đã được chấp nhận, hoặc gap do slice trước để lại hay do target thay đổi
        - Experiment — đo một giả thuyết, kết quả sẽ bị bỏ hoặc viết lại
        - Modelling — sản phẩm chính là specification hoặc ADR
        - Delivery — tạo behaviour mới có giá trị
        - Discovery — chỉ tạo ra hiểu biết, không tạo behaviour

  - type: textarea
    id: problem
    attributes:
      label: Vấn đề
      description: Vấn đề hoặc nhu cầu mà tính năng này giải quyết — ai bị ảnh hưởng, tại sao cần.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Đề xuất
      description: Hướng giải pháp đề xuất (nếu đã có); bỏ trống nếu chỉ mới nêu vấn đề.

  - type: input
    id: scope
    attributes:
      label: Scope
      description: 'Nx project / service liên quan (nếu biết) — vd: account, transactional-mail.'

  - type: textarea
    id: acceptance
    attributes:
      label: Tiêu chí chấp nhận
      description: Điều kiện để biết tính năng đã hoàn thành.
      placeholder: |
        - [ ] ...
        - [ ] ...

  - type: checkboxes
    id: constraints
    attributes:
      label: Ràng buộc đã cân nhắc
      options:
        - label: Không truy cập database xuyên service; giao tiếp qua API/event contract
        - label: Migration (nếu có) theo expand → compatible rollout → contract
        - label: Không log prompt/response body; không đưa secret vào Git

  - type: textarea
    id: project-tracking
    attributes:
      label: Theo dõi Project
      description: |
        Field này chỉ **ghi rationale**; nó không tự gắn label. Điền khi Issue có nhu cầu portfolio visibility
        hoặc coordination mà Issue/Milestone không biểu đạt đủ, và trả lời cả ba câu: ai hoặc cái gì cần visibility;
        dependency, decision hoặc coordination nào cần theo dõi ở cấp Project; vì sao Issue hoặc Milestone không đủ.
        Gắn label `project:track` là thao tác riêng của người tạo Issue, chỉ sau khi tự đánh giá policy và thấy đủ điều kiện.
        Điều kiện đưa Issue vào Project ở §3.2 và rationale bắt buộc ở §3.3 của `docs/engineering/work-management.md`.
        Không gắn label chỉ vì Issue có priority cao, thuộc một work kind, thuộc một product hoặc Milestone.
        Không cần theo dõi thì để trống.
