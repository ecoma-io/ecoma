name: Yêu cầu tính năng
description: Đề xuất capability mới hoặc thay đổi behavior hiện tại
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Viết issue bằng tiếng Việt; giữ nguyên file path, error code, technical term.
        Phân loại công việc ghi qua kênh tạm thời — dropdown `Loại công việc` dưới đây — cho tới khi org
        cấu hình năm Issue Type; sau đó chọn Issue Type khi tạo issue (UI hoặc `gh issue create --type`).
        Form không gán được Issue Type, nên Issue tạo qua form vẫn dùng kênh tạm thời cho tới khi work item
        dọn dẹp gỡ bỏ (`docs/engineering/work-management.md` §2.3).

  - type: dropdown
    id: work-kind
    attributes:
      label: Loại công việc (kênh tạm thời)
      description: |
        Kênh tạm thời trong giai đoạn chuyển đổi (`docs/engineering/work-management.md` §2.3): khi
        org cấu hình năm Issue Type, native Issue Type là kênh có thẩm quyền; Issue tạo qua form vẫn
        ghi bằng kênh này cho tới khi work item dọn dẹp gỡ bỏ nó.
        Chọn theo thứ tự ưu tiên ở `docs/engineering/evolution-process.md` §4.1:
        Remediation → Experiment → Modelling → Delivery → Discovery. Không chắc thì để trống.
      options:
        - Remediation — đóng deviation hoặc gap đã biết
        - Experiment — đo một giả thuyết kỹ thuật
        - Modelling — sản phẩm chính là specification hoặc ADR
        - Delivery — tạo behaviour mới có giá trị
        - Discovery — chỉ tạo ra hiểu biết
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: Vấn đề
      description: Vấn đề hoặc nhu cầu mà tính năng này giải quyết — ai bị ảnh hưởng, tại sao cần.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Đề xuất
      description: Hướng giải pháp đề xuất (nếu đã có); bỏ trống nếu chỉ mới nêu vấn đề.

  - type: input
    id: scope
    attributes:
      label: Scope
      description: 'Nx project / service liên quan (nếu biết) — vd: account, transactional-mail.'

  - type: input
    id: change-spec
    attributes:
      label: Change Specification
      placeholder: 'đường dẫn tới `docs/changes/...` nếu công việc theo một Change Specification đã có; để trống nếu không'

  - type: input
    id: product
    attributes:
      label: Product / pipeline
      placeholder: 'product area, ví dụ theo `docs/features/`; để trống nếu là work dùng chung'

  - type: textarea
    id: acceptance
    attributes:
      label: Tiêu chí chấp nhận
      description: Điều kiện để biết tính năng đã hoàn thành.
      placeholder: |
        - [ ] ...
        - [ ] ...

  - type: checkboxes
    id: constraints
    attributes:
      label: Ràng buộc đã cân nhắc
      options:
        - label: Không truy cập database xuyên service; giao tiếp qua API/event contract
        - label: Migration (nếu có) theo expand → compatible rollout → contract
        - label: Không log prompt/response body; không đưa secret vào Git

  - type: markdown
    attributes:
      value: |
        Root issue (Issue không có parent) được gắn label `project:track` sau khi tạo, theo §3.2
        của `docs/engineering/work-management.md`. Form không biết parentage lúc tạo nên không hỏi ở đây.
        Sub-issue không bao giờ mang label này.
