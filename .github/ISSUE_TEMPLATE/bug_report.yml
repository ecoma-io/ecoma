name: Báo lỗi
description: Mô tả một lỗi quan sát được trong service, CI hoặc tooling
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Viết issue bằng tiếng Việt; giữ nguyên file path, error code, technical term.
        Không phải work item thì đừng dùng form này: xem khác biệt giữa work item, coordination ledger,
        precondition tracker và experiment record ở `docs/engineering/work-management.md` §2.2.
        Chọn Issue Type khi tạo issue (UI hoặc `gh issue create --type`); form này không gán được Issue Type.
        Quy tắc Issue: `docs/engineering/work-management.md` §2.3.

  - type: dropdown
    id: work-kind
    attributes:
      label: Loại công việc (kênh tạm thời)
      description: |
        Kênh tạm thời trong giai đoạn chuyển đổi cho đến khi org cấu hình năm Issue Type
        (`docs/engineering/work-management.md` §2.3); sẽ bị loại bỏ bởi work item dọn dẹp.
        Chọn theo thứ tự ưu tiên ở `docs/engineering/evolution-process.md` §4.1:
        Remediation → Experiment → Modelling → Delivery → Discovery. Không chắc thì để trống.
      options:
        - Remediation — đóng deviation hoặc gap đã biết
        - Experiment — đo một giả thuyết kỹ thuật
        - Modelling — sản phẩm chính là specification hoặc ADR
        - Delivery — tạo behaviour mới có giá trị
        - Discovery — chỉ tạo ra hiểu biết
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: Mô tả lỗi
      description: Chuyện gì đã xảy ra, ở đâu, khi nào.
      placeholder: 'Ví dụ: CI fail ở bước Check PR title với lỗi scope-enum trên nhánh ...'
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Các bước tái hiện
      description: Các bước tối thiểu để tái hiện; nếu không tái hiện được thì ghi rõ điều kiện.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Kỳ vọng
      description: Kết quả mong đợi.
    validations:
      required: true

  - type: input
    id: scope
    attributes:
      label: Scope
      description: 'Nx project bị ảnh hưởng (nếu biết) — vd: account, llm-console, docs.'

  - type: textarea
    id: logs
    attributes:
      label: Log / error code
      description: Dán log hoặc error code nguyên văn (không dịch, không cắt quan trọng).
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Môi trường
      description: Local / CI / Preview / Staging / Production; version, URL hoặc commit SHA liên quan.

  - type: markdown
    attributes:
      value: |
        Root issue (Issue không có parent) được gắn label `project:track` sau khi tạo, theo §3.2
        của `docs/engineering/work-management.md`. Form không biết parentage lúc tạo nên không hỏi ở đây.
        Sub-issue không bao giờ mang label này.
