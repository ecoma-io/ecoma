name: Tài liệu
description: Thiếu, sai hoặc cần cải thiện tài liệu trong docs/ hoặc README
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: |
        Viết issue bằng tiếng Việt; giữ nguyên file path và technical term.
        Quy tắc tài liệu: docs/AGENTS.md. Loại công việc và quy tắc Issue: docs/engineering/work-management.md.

  - type: dropdown
    id: work-kind
    attributes:
      label: Loại công việc
      description: |
        Bản chất thay đổi, khác với nhãn issue. Các lựa chọn xếp theo thứ tự ưu tiên ở
        `docs/engineering/evolution-process.md` §4.1: Remediation → Experiment → Modelling → Delivery → Discovery.
        Không chắc thì để trống và ghi lý do trong phần chi tiết.
      options:
        - Remediation — đóng một deviation đã được chấp nhận, hoặc gap do slice trước để lại hay do target thay đổi
        - Experiment — đo một giả thuyết, kết quả sẽ bị bỏ hoặc viết lại
        - Modelling — sản phẩm chính là specification hoặc ADR
        - Delivery — tạo behaviour mới có giá trị
        - Discovery — chỉ tạo ra hiểu biết, không tạo behaviour

  - type: input
    id: path
    attributes:
      label: Tài liệu liên quan
      description: Đường dẫn file (giữ nguyên, không dịch).
      placeholder: 'Ví dụ: docs/architecture/02-delivery.md'
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Loại vấn đề
      options:
        - Sai sự thật (không khớp code/behavior hiện tại)
        - Thiếu (chưa được ghi)
        - Không rõ / dễ hiểu nhầm
        - Lạc đề / sai phạm vi tài liệu
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: Chi tiết
      description: Cái gì sai/thiếu, nên ghi thêm gì, nguồn tham chiếu (nếu có).
    validations:
      required: true

  - type: textarea
    id: project-tracking
    attributes:
      label: Theo dõi Project
      description: |
        Chỉ điền khi Issue cần portfolio visibility hoặc coordination giữa các workstream, và trả lời cả ba câu:
        workstream nào cần visibility; dependency, decision hoặc coordination nào cần theo dõi ở cấp Project;
        vì sao Issue/Milestone thông thường không đủ. Kèm theo label `project:track`.
        Điều kiện phân loại và lý do bắt buộc ở `docs/engineering/work-management.md` §3.3.
        Không gắn label chỉ vì Issue có priority cao, thuộc một work kind, thuộc một product hoặc Milestone.
        Không cần theo dõi thì để trống.
