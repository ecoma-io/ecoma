name: Tài liệu
description: Thiếu, sai hoặc cần cải thiện tài liệu trong docs/ hoặc README
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: |
        Viết issue bằng tiếng Việt; giữ nguyên file path và technical term.
        Quy tắc tài liệu: docs/AGENTS.md.
        Chọn Issue Type khi tạo issue (UI hoặc `gh issue create --type`); form này không gán được Issue Type.
        Quy tắc Issue: docs/engineering/work-management.md §2.3.

  - type: dropdown
    id: work-kind
    attributes:
      label: Loại công việc (kênh tạm thời)
      description: |
        Kênh tạm thời trong giai đoạn chuyển đổi cho đến khi org cấu hình năm Issue Type
        (docs/engineering/work-management.md §2.3); sẽ bị loại bỏ bởi work item dọn dẹp.
        Chọn theo thứ tự ưu tiên ở docs/engineering/evolution-process.md §4.1:
        Remediation → Experiment → Modelling → Delivery → Discovery. Không chắc thì để trống.
      options:
        - Remediation — đóng deviation hoặc gap đã biết
        - Experiment — đo một giả thuyết kỹ thuật
        - Modelling — sản phẩm chính là specification hoặc ADR
        - Delivery — tạo behaviour mới có giá trị
        - Discovery — chỉ tạo ra hiểu biết
    validations:
      required: false

  - type: input
    id: path
    attributes:
      label: Tài liệu liên quan
      description: Đường dẫn file (giữ nguyên, không dịch).
      placeholder: 'Ví dụ: docs/architecture/02-delivery.md'
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Loại vấn đề
      options:
        - Sai sự thật (không khớp code/behavior hiện tại)
        - Thiếu (chưa được ghi)
        - Không rõ / dễ hiểu nhầm
        - Lạc đề / sai phạm vi tài liệu
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: Chi tiết
      description: Cái gì sai/thiếu, nên ghi thêm gì, nguồn tham chiếu (nếu có).
    validations:
      required: true

  - type: textarea
    id: project-tracking
    attributes:
      label: Theo dõi Project (root issue)
      description: |
        Chỉ dành cho root issue: ghi một dòng vì sao root issue này cần portfolio visibility
        trong giai đoạn chuyển tiếp. Label `project:track` chỉ áp dụng cho root issue, không
        bao giờ cho sub-issue, và là ràng buộc chuyển tiếp — xem §3 của
        docs/engineering/work-management.md. Sub-issue hoặc không cần theo dõi thì để trống.
