name: Công việc kỹ thuật
description: Discovery, Modelling, Experiment hoặc một work item kỹ thuật không thuộc bug / feature / tài liệu
body:
  - type: markdown
    attributes:
      value: |
        Dùng form này khi công việc là điều tra, mô hình hoá, thử nghiệm, hoặc một delivery/remediation
        không mô tả được bằng form bug / feature / tài liệu.
        Viết body bằng tiếng Việt; giữ nguyên file path, command, error code và technical term.
        Không phải work item thì đừng dùng form này: xem khác biệt giữa work item, coordination ledger,
        precondition tracker và experiment record ở `docs/engineering/work-management.md` §2.2.
        Phân loại Issue Type theo ba giai đoạn transition (`docs/engineering/work-management.md` §2.3): trước khi
        org cấu hình năm Issue Type, dòng `## Loại công việc` trong Issue body và dropdown dưới đây là kênh tạm thời
        có thẩm quyền; sau khi org cấu hình, native Issue Type là kênh có thẩm quyền và Issue tạo qua form vẫn ghi
        bằng dòng body cho tới khi được migrate; sau khi work item dọn dẹp gỡ bỏ kênh tạm thời, chỉ còn native
        Issue Type.

  - type: dropdown
    id: work-kind
    attributes:
      label: Loại công việc (kênh tạm thời)
      description: |
        Bắt buộc — không tạo work item thiếu phân loại. Không xác định được loại nào thì dừng và giải quyết
        mâu thuẫn phân loại trước, theo thứ tự ưu tiên ở `docs/engineering/evolution-process.md` §4.1;
        không bỏ trống và không thay bằng giá trị khác, kể cả type mặc định Task/Bug/Feature của GitHub.
        Dropdown này ghi dòng `## Loại công việc` trong Issue body — ba giai đoạn transition xem ở đầu form.
      options:
        - Remediation — đóng deviation hoặc gap đã biết
        - Experiment — đo một giả thuyết kỹ thuật
        - Modelling — sản phẩm chính là specification hoặc ADR
        - Delivery — tạo behaviour mới có giá trị
        - Discovery — chỉ tạo ra hiểu biết
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: |
        Kết quả quan sát được sau khi công việc xong — không phải danh sách việc cần làm.
        Với Discovery: câu hỏi cần trả lời. Với Modelling: specification/ADR nào sẽ thay đổi.
        Với Experiment: hypothesis và câu hỏi nó trả lời.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Phạm vi
      description: Phần nào của hệ thống được phép thay đổi, và phần nào là non-goal.
    validations:
      required: true

  - type: input
    id: change-spec
    attributes:
      label: Change Specification
      description: |
        Đường dẫn chính xác trong repository tới Change Specification mà root Issue này sở hữu, dạng
        `docs/changes/<name>.md`; để trống nếu công việc không thuộc spec nào. Giá trị này dùng cho
        ownership lookup (`docs/changes/README.md` §4): một spec active có đúng một owning root issue —
        không root issue nào tham chiếu là escalation `no reachable owner`, nhiều hơn một là ownership
        drift, báo coordinator.
      placeholder: 'docs/changes/<name>.md — để trống nếu không có'

  - type: dropdown
    id: product
    attributes:
      label: Sản phẩm (Product)
      description: |
        Chọn Product ID theo registry trong `docs/engineering/work-management.md` §4.1. Delivery issue
        gắn với một product cụ thể: chọn Product ID của pipeline đang lái. Root issue cross-product:
        để trống ở đây và liệt kê các product tham gia trong Outcome/Phạm vi — root cross-product không
        mang một Product ID duy nhất. Công việc của shared context (không pipeline sản phẩm nào lái):
        để trống và nêu tên shared context trong Phạm vi. Không suy Product từ tên feature directory,
        bounded context, Nx project hay application (`llm-seller`/`llm-console` là application của
        `llm-marketplace`).
      options:
        - llm-marketplace
        - pact-broker
        - remote-cache
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Bằng chứng và ràng buộc
      description: |
        Ghi rõ đâu là đã verify (kèm `file:line` hoặc lệnh), đâu là suy luận, đâu là chưa biết.
        Nêu invariant, contract hoặc quyết định đã accept đang ràng buộc công việc này, kèm link canonical.
    validations:
      required: true

  - type: textarea
    id: experiment-criteria
    attributes:
      label: Tiêu chí đo (chỉ cho Experiment)
      description: |
        Hypothesis, phạm vi và môi trường đo, tiêu chí đánh giá đặt trước, cách ghi kết quả.
        Bỏ trống với các loại công việc khác.

  - type: markdown
    attributes:
      value: |
        Root issue (Issue không có parent): trong transition, label `project:track` được gắn ngay khi tạo và
        chỉ áp dụng cho root issue — hành động admission theo §3.2–§3.3 của `docs/engineering/work-management.md`.
        Theo policy đích, mọi root issue thuộc Project; sub-issue không thuộc Project và không bao giờ mang
        label này. Form không biết parentage lúc tạo nên không hỏi ở đây.

  - type: textarea
    id: dependencies
    attributes:
      label: Dependency và quyết định đang mở
      description: Work item hoặc điều kiện phải xong trước; quyết định chưa chốt nào đang chặn công việc này.

  - type: textarea
    id: completion
    attributes:
      label: Điều kiện hoàn thành
      description: |
        Cách verify, không phải danh sách task. Mỗi tiêu chí phải kiểm được mà không cần đoán ý người viết.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: Liên quan
      description: Issue/PR/tài liệu canonical liên quan, dạng link chính xác (`#N`, path).
