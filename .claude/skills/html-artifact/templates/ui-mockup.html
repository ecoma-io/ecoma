<script>
  // TODO_REPLACE: set SIZES to the target app's supported range (see references/genres/ui-mockup.md).
  // Desktop/web widths snap to the workspace breakpoint scale (sm 640 · md 768 · lg 1024 · xl 1280 ·
  // 2xl 1536 · 3xl 1920 · 4xl 2560 · 5xl 3440) — include only the steps the app actually supports;
  // phone/tablet presets use real device viewports (360×740, 390×844, 430×932, 768×1024) instead.
  // Desktop app example below: declared minimum → ultrawide maximum, plus Fit (free-flow).
  // Shared default; a .vph section overrides it with data-sizes='[{"label":"Fit","fit":true},…]'
  // when its mockup targets a different range (invalid JSON fails loudly — no silent fallback).
  const SIZES = [
    { label: "Fit", fit: true },
    { label: "Min 1024", w: 1024, h: 640 },
    { label: "1280", w: 1280, h: 800 },
    { label: "1920 FHD", w: 1920, h: 1080 },
    { label: "2560 QHD", w: 2560, h: 1440 },
    { label: "Max 3440", w: 3440, h: 1440 },
  ];

  function initHarness(root) {
    const sizes = root.dataset.sizes ? JSON.parse(root.dataset.sizes) : SIZES;
    root.insertAdjacentHTML(
      "afterbegin",
      '<header class="vp-bar">' +
        '<span class="vp-title"></span>' +
        '<select class="vp-screens" aria-label="Screen" hidden></select>' +
        '<div class="vp-presets"></div>' +
        '<button class="vp-rotate" type="button" title="Rotate (swap width/height)" aria-pressed="false">⟳</button>' +
        '<button class="vp-actual" type="button" title="Actual size — scroll to pan" aria-pressed="false">1:1</button>' +
        '<form class="vp-custom">' +
        '<input class="vp-w" type="number" inputmode="numeric" min="240" max="3840" placeholder="W" aria-label="Custom width (px)">' +
        " × " +
        '<input class="vp-h" type="number" inputmode="numeric" min="240" max="3840" placeholder="H" aria-label="Custom height (px)">' +
        '<button type="submit">Set</button>' +
        "</form>" +
        '<span class="vp-label" aria-live="polite"></span>' +
        "</header>" +
        '<div class="vp-stage"><div class="vp-wrap"><iframe title="Mockup preview"></iframe></div></div>',
    );
    root.querySelector(".vp-title").textContent = root.dataset.title || "";

    const frame = root.querySelector("iframe");
    const wrap = root.querySelector(".vp-wrap");
    const stage = root.querySelector(".vp-stage");
    const label = root.querySelector(".vp-label");
    const presets = root.querySelector(".vp-presets");
    const rotateBtn = root.querySelector(".vp-rotate");
    const actualBtn = root.querySelector(".vp-actual");
    const screenSel = root.querySelector(".vp-screens");
    const screens = Array.from(root.querySelectorAll("template[data-screen]"));
    let current = sizes.find((s) => !s.fit) || sizes[0];
    let rotated = false;
    let actual = false;

    function buildDoc(tpl) {
      return (
        '<!doctype html><html><head><meta charset="utf-8">' +
        '<meta name="viewport" content="width=device-width, initial-scale=1"></head><body>' +
        tpl.innerHTML +
        "</body></html>"
      );
    }
    function loadScreen(i) {
      frame.srcdoc = buildDoc(screens[i]);
    }
    if (screens.length > 1) {
      screenSel.hidden = false;
      screens.forEach((t, i) => screenSel.add(new Option(t.dataset.screen, String(i))));
      screenSel.addEventListener("change", () => loadScreen(Number(screenSel.value)));
    }

    // Mirror the artifact viewer's theme toggle into the iframe document.
    function syncTheme() {
      const doc = frame.contentDocument;
      if (!doc || !doc.documentElement) return;
      const t = document.documentElement.getAttribute("data-theme");
      if (t) doc.documentElement.setAttribute("data-theme", t);
      else doc.documentElement.removeAttribute("data-theme");
    }
    frame.addEventListener("load", syncTheme);
    new MutationObserver(syncTheme).observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["data-theme"],
    });

    function dims() {
      return rotated ? { w: current.h, h: current.w } : { w: current.w, h: current.h };
    }

    function layout() {
      presets
        .querySelectorAll("button")
        .forEach((b, i) => b.setAttribute("aria-pressed", String(sizes[i] === current)));
      rotateBtn.disabled = !!current.fit;
      rotateBtn.setAttribute("aria-pressed", String(rotated && !current.fit));
      actualBtn.disabled = !!current.fit;
      actualBtn.setAttribute("aria-pressed", String(actual && !current.fit));
      wrap.classList.toggle("actual", actual && !current.fit);
      if (current.fit) {
        wrap.style.width = "calc(100% - 2px)";
        wrap.style.height = "min(75svh, 720px)";
        frame.style.width = "100%";
        frame.style.height = "100%";
        frame.style.transform = "none";
        label.textContent = "fit";
        return;
      }
      const { w, h } = dims();
      const pad = parseFloat(getComputedStyle(stage).paddingLeft) || 0;
      const avail = Math.max(120, stage.clientWidth - pad * 2);
      frame.style.width = w + "px";
      frame.style.height = h + "px";
      if (actual) {
        frame.style.transform = "none";
        wrap.style.width = Math.min(avail, w) + "px";
        wrap.style.height = Math.min(Math.round(window.innerHeight * 0.75), h) + "px";
        label.textContent = w + "×" + h + " · 100%";
        return;
      }
      const scale = Math.min(1, avail / w);
      frame.style.transform = scale < 1 ? "scale(" + scale + ")" : "none";
      wrap.style.width = Math.round(w * scale) + "px";
      wrap.style.height = Math.round(h * scale) + "px";
      label.textContent = w + "×" + h + (scale < 1 ? " · " + Math.round(scale * 100) + "%" : "");
    }

    sizes.forEach((s) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = s.label;
      b.addEventListener("click", () => {
        current = s;
        layout();
      });
      presets.appendChild(b);
    });

    rotateBtn.addEventListener("click", () => {
      rotated = !rotated;
      layout();
    });
    actualBtn.addEventListener("click", () => {
      actual = !actual;
      layout();
    });

    root.querySelector(".vp-custom").addEventListener("submit", (e) => {
      e.preventDefault();
      const w = Number(root.querySelector(".vp-w").value);
      const h = Number(root.querySelector(".vp-h").value);
      if (w >= 240 && h >= 240) {
        current = { label: "custom", w, h };
        rotated = false;
        layout();
      }
    });

    window.addEventListener("resize", layout);
    if (screens.length) loadScreen(0);
    layout();
  }

  document.querySelectorAll(".vph").forEach(initHarness);
</script>
