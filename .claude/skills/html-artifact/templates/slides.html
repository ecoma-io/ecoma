<!-- html-artifact template: slides. Replace every TODO_REPLACE; restyle tokens per artifact-design.
     Vertical scroll-snap deck: arrows/space on desktop, natural scroll + HUD buttons on mobile. -->
<title>TODO_REPLACE — Slides</title>
<style>
  :root {
    /* TODO_REPLACE: placeholder palette — restyle per artifact-design */
    --bg: #ffffff;
    --surface: #f4f5f7;
    --text: #1c1f23;
    --muted: #5b6470;
    --line: #dfe3e8;
    --accent: #3b6ff0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --surface: #1d2126;
      --text: #e7eaee;
      --muted: #97a1ac;
      --line: #2b3138;
      --accent: #7da2ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171a;
    --surface: #1d2126;
    --text: #e7eaee;
    --muted: #97a1ac;
    --line: #2b3138;
    --accent: #7da2ff;
  }
  :root[data-theme="light"] {
    --bg: #ffffff;
    --surface: #f4f5f7;
    --text: #1c1f23;
    --muted: #5b6470;
    --line: #dfe3e8;
    --accent: #3b6ff0;
  }

  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
  }

  .deck {
    height: 100svh;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
  }
  .slide {
    min-height: 100svh;
    scroll-snap-align: start;
    display: grid;
    place-content: center;
    gap: 16px;
    padding: clamp(24px, 6vw, 80px);
    max-width: 100%;
  }
  .slide h1 {
    font-size: clamp(2rem, 7vw, 3.6rem);
    line-height: 1.1;
    margin: 0;
    text-wrap: balance;
  }
  .slide h2 {
    font-size: clamp(1.5rem, 5vw, 2.4rem);
    line-height: 1.2;
    margin: 0;
    text-wrap: balance;
  }
  .slide p,
  .slide li {
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    line-height: 1.6;
    max-width: 60ch;
  }
  .slide ul {
    margin: 0;
    padding-left: 1.2em;
    display: grid;
    gap: 0.5em;
  }
  .slide .kicker {
    color: var(--accent);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
  }

  .hud {
    position: fixed;
    right: 12px;
    bottom: 12px;
    z-index: 5;
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
  }
  .hud button {
    min-width: 44px;
    min-height: 44px;
    border: 0;
    border-radius: 999px;
    background: none;
    color: var(--text);
    font: inherit;
    font-size: 18px;
    cursor: pointer;
  }
  .hud button:focus-visible {
    outline: 2px solid var(--accent);
  }
  .hud .count {
    color: var(--muted);
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
    min-width: 3.5em;
    text-align: center;
  }
</style>

<div class="deck" id="deck">
  <section class="slide">
    <span class="kicker">TODO_REPLACE Kicker</span>
    <h1>TODO_REPLACE Deck title</h1>
    <p>TODO_REPLACE Subtitle — who this is for and what it decides.</p>
  </section>
  <section class="slide">
    <h2>TODO_REPLACE Point one</h2>
    <ul>
      <li>TODO_REPLACE</li>
      <li>TODO_REPLACE</li>
    </ul>
  </section>
  <section class="slide">
    <h2>TODO_REPLACE Closing</h2>
    <p>TODO_REPLACE The ask or the next step.</p>
  </section>
</div>

<div class="hud">
  <button id="prev" type="button" aria-label="Previous slide">←</button>
  <span class="count" id="count"></span>
  <button id="next" type="button" aria-label="Next slide">→</button>
</div>

<script>
  const deck = document.getElementById("deck");
  const slides = Array.from(deck.querySelectorAll(".slide"));
  const count = document.getElementById("count");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");

  function indexNow() {
    const y = deck.scrollTop + deck.clientHeight / 2;
    const i = slides.findIndex((s) => y < s.offsetTop + s.offsetHeight);
    return i === -1 ? slides.length - 1 : i;
  }
  function updateCount() {
    count.textContent = indexNow() + 1 + "/" + slides.length;
  }
  function go(i) {
    const t = Math.max(0, Math.min(slides.length - 1, i));
    deck.scrollTo({ top: slides[t].offsetTop, behavior: reduced.matches ? "auto" : "smooth" });
  }

  deck.addEventListener("scroll", updateCount, { passive: true });
  document.getElementById("prev").addEventListener("click", () => go(indexNow() - 1));
  document.getElementById("next").addEventListener("click", () => go(indexNow() + 1));
  addEventListener("keydown", (e) => {
    if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) {
      e.preventDefault();
      go(indexNow() + 1);
    }
    if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) {
      e.preventDefault();
      go(indexNow() - 1);
    }
  });
  updateCount();
</script>
